<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget: просим браузер ужимать страницу под клавиатуру,
     а не накрывать её сверху -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f6f3" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18151c" />
<title>Чат · Мы вдвоём</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  :root {
    --bubble-in: #e9e6eb;
    --bubble-in-text: var(--text);
    --chat-bg: var(--surface);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bubble-in: #2a262f; --chat-bg: #121015; }
  }

  .chat-wrap {
    position: relative;              /* якорь для кнопки «вниз» */
    display: flex; flex-direction: column;
    height: min(78vh, 780px);
    padding: 0; overflow: hidden;
    background: var(--chat-bg);
  }

  /* ---------- шапка чата: она же навигация на телефоне ---------- */
  .chat-head {
    position: relative;
    z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 8px 8px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    flex: none;
    background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep);
  }
  .chat-head .back { color: var(--accent); margin-right: -4px; }
  .chat-head .back .i { width: 26px; height: 26px; }
  .chat-head .head-text { flex: 1; min-width: 0; }
  .chat-head .name { font-weight: 600; font-size: var(--t-body); line-height: 1.2; }
  .chat-head .sub {
    display: grid;
    font-size: var(--t-foot); color: var(--text-2); line-height: 1.3;
  }
  /* «печатает…» и «был недавно» сменяют друг друга мягко, с размытием */
  .chat-head .sub > span { grid-area: 1 / 1; transition: opacity 200ms ease, filter 200ms ease, transform 240ms var(--ease-out); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .sub .typing-label { color: var(--accent); opacity: 0; filter: blur(3px); transform: translateY(3px); }
  .chat-head .sub.is-typing .typing-label { opacity: 1; filter: none; transform: none; }
  .chat-head .sub.is-typing .seen-label { opacity: 0; filter: blur(3px); transform: translateY(-3px); }
  .chat-head .sub.online .seen-label { color: var(--ok); }
  .chat-head #btn-hug { color: var(--heart); }

  /* ---------- лента ---------- */
  .chat-log {
    flex: 1; overflow-y: auto;
    padding: 14px 12px 8px;
    display: flex; flex-direction: column;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    /* Лента должна уметь вставать в низ мгновенно: иначе она продолжает
       доезжать уже после того, как мы замерили место для вылета сообщения,
       и вылет косит. Плавность там, где нужна, запрашивается в коде. */
    scroll-behavior: auto;
  }
  /* пока сообщений мало, они лежат внизу, а не висят вверху пустого экрана */
  .chat-log::before { content: ''; margin-top: auto; }
  .chat-log::-webkit-scrollbar { width: 7px; }
  .chat-log::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 9px; }

  .day-sep {
    align-self: center;
    font-size: var(--t-caption); font-weight: 600; color: var(--text-3);
    padding: 4px 12px;
    margin: 12px 0 6px;
  }

  /* ---------- пузыри ---------- */
  .bubble {
    max-width: min(78%, 520px);
    padding: 8px 13px 7px;
    border-radius: 20px;
    line-height: 1.38;
    font-size: var(--t-body);
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    position: relative;
    margin-top: 2px;
    touch-action: pan-y;            /* вертикальная прокрутка остаётся живой */
    transition: opacity .3s ease;
    /* Анимация висит на .enter, а не на самом пузыре: иначе она
       переигрывалась бы у всей ленты при каждом обновлении. */
  }
  .bubble.enter { animation: bubble-in 480ms var(--spring-soft) both; }
  /* держишь палец — пузырь понемногу вдавливается: скоро откроется меню */
  .bubble.press { animation: hold 460ms cubic-bezier(.2, .8, .2, 1) forwards; }
  @keyframes hold { 0% { transform: none; } 22% { transform: scale(.965); } 100% { transform: scale(.935); } }
  .bubble.unpress { transition: transform var(--release), opacity .3s ease; }
  .bubble.swiping { transition: none; }
  .bubble.releasing { transition: transform 420ms var(--spring); }
  .bubble.flash { animation: flash 1.1s ease; }

  /* сообщения одного человека подряд — слитной группой, как в iMessage */
  .bubble.group-start { margin-top: 10px; }

  .bubble.mine {
    align-self: flex-end;
    background: var(--accent-fill);
    color: #fff;
    transform-origin: bottom right;
  }
  .bubble.mine.group-end { border-bottom-right-radius: 6px; }
  .bubble.theirs {
    align-self: flex-start;
    background: var(--bubble-in);
    color: var(--bubble-in-text);
    transform-origin: bottom left;
  }
  .bubble.theirs.group-end { border-bottom-left-radius: 6px; }

  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(14px) scale(.9); }
  }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    25%      { box-shadow: 0 0 0 4px var(--accent-soft); }
  }

  /* стрелка ответа, проявляется по мере свайпа */
  .bubble .swipe-arrow {
    position: absolute; top: 50%; left: -40px;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--fill); color: var(--text-2);
    pointer-events: none;
    opacity: var(--sw, 0);
    transform: translateY(-50%) scale(calc(.5 + var(--sw, 0) * .5));
  }
  .bubble .swipe-arrow .i, .bubble .reply-btn .i { width: 17px; height: 17px; }
  .bubble.theirs .swipe-arrow { left: auto; right: -40px; }

  /* кнопка ответа для мыши */
  .bubble .reply-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    left: -38px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--fill); color: var(--text-2);
    opacity: 0; transition: opacity var(--d-fast), transform var(--d-fast) var(--ease-out);
  }
  .bubble.theirs .reply-btn { left: auto; right: -38px; }
  @media (hover: hover) and (pointer: fine) {
    .bubble:hover .reply-btn { opacity: 1; }
    .bubble .reply-btn:hover { transform: translateY(-50%) scale(1.1); color: var(--text); }
  }
  @media (pointer: coarse) { .bubble .reply-btn { display: none; } }

  /* ---------- реакции ---------- */
  .bubble.has-reacts { margin-bottom: 14px; }
  .reacts {
    position: absolute; bottom: -15px;
    display: flex; align-items: center; gap: 1px;
    padding: 2px 6px;
    min-height: 24px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 0 0 2px var(--chat-bg), var(--shadow-1);
    font-size: .82rem; line-height: 1;
    color: var(--text-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .bubble.mine .reacts { left: 8px; }
  .bubble.theirs .reacts { right: 8px; }
  .reacts .n { font-size: var(--t-caption); font-weight: 600; margin-left: 2px; }
  .reacts.pop { animation: react-pop 520ms var(--spring) both; }
  @keyframes react-pop { from { transform: scale(.3); opacity: 0; } }

  /* двойное касание — сердце вспыхивает на пузыре */
  .heart-pop {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    color: var(--heart);
    pointer-events: none;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .25));
    animation: heart-pop 760ms var(--ease-out) forwards;
  }
  .heart-pop .i { width: 100%; height: 100%; }
  @keyframes heart-pop {
    0%   { transform: scale(.3); opacity: 0; }
    30%  { transform: scale(1.15); opacity: 1; }
    55%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.05) translateY(-18px); opacity: 0; }
  }

  /* ---------- меню сообщения (долгое нажатие) ---------- */
  .menu-veil {
    position: fixed; inset: 0; z-index: 69;
    background: var(--scrim);
    opacity: 0;
    transition: opacity 220ms ease;
  }
  .menu-veil.in { opacity: .7; }
  .msg-menu {
    position: fixed; z-index: 70;
    width: 236px;
    display: flex; flex-direction: column; gap: 8px;
    opacity: 0;
    transform: scale(.88);
    filter: blur(4px);
    transition: opacity 180ms ease, transform 420ms var(--spring-soft), filter 220ms var(--ease-out);
  }
  /* меню «материализуется»: проявляется из размытия, а не просто из прозрачности */
  .msg-menu.in { opacity: 1; transform: none; filter: blur(0); }
  .msg-menu .react-bar {
    display: flex; justify-content: space-between;
    padding: 5px 6px;
    border-radius: 999px;
    background: var(--raised);
    box-shadow: var(--shadow-2);
  }
  .msg-menu .react-bar button {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.3rem;
    transition: transform var(--release), background-color var(--d-fast);
    --ps: .82;
  }
  .msg-menu .react-bar button[aria-pressed="true"] { background: var(--accent-soft); }
  .msg-menu .react-bar button:nth-child(n) { animation: react-in 420ms var(--spring) both; }
  .msg-menu .react-bar button:nth-child(2) { animation-delay: 25ms; }
  .msg-menu .react-bar button:nth-child(3) { animation-delay: 50ms; }
  .msg-menu .react-bar button:nth-child(4) { animation-delay: 75ms; }
  .msg-menu .react-bar button:nth-child(5) { animation-delay: 100ms; }
  .msg-menu .react-bar button:nth-child(6) { animation-delay: 125ms; }
  @keyframes react-in { from { transform: scale(.4) translateY(6px); opacity: 0; } }

  .msg-menu .actions {
    border-radius: 16px;
    background: var(--raised);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .msg-menu .actions button {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 46px; padding: 10px 16px;
    font-size: var(--t-body);
    text-align: left;
    transition: background var(--d-fast);
  }
  .msg-menu .actions button + button::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: .5px; background: var(--sep);
  }
  .msg-menu .actions button { transition: background-color 320ms ease; }
  .msg-menu .actions button.is-pressed { transform: none; background: var(--fill); transition-duration: 0s !important; }
  .msg-menu .actions button .i { width: 20px; height: 20px; color: var(--text-2); }
  .msg-menu .actions button.danger, .msg-menu .actions button.danger .i { color: var(--danger); }
  @media (hover: hover) and (pointer: fine) {
    .msg-menu .actions button:hover { background: var(--fill); }
    .msg-menu .react-bar button:hover { background: var(--fill); }
  }

  .bubble.menu-open { transform: scale(1.03); transition: transform 460ms var(--spring); }
  .bubble.edited-flash { animation: edited 1s ease; }
  @keyframes edited {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    30%      { box-shadow: 0 0 0 3px var(--accent-soft); }
  }

  /* на телефоне гасим системное выделение — оно спорит с долгим нажатием.
     Скопировать текст можно из того же меню. */
  @media (pointer: coarse) {
    .bubble { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  }

  .bubble .edited { opacity: .75; margin-right: 2px; }

  /* цитата внутри пузыря */
  .quote {
    display: block; cursor: pointer;
    margin: 0 -4px 6px; padding: 6px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, .14);
    font-size: var(--t-sub); line-height: 1.3;
    transition: background var(--d-fast);
  }
  .bubble.theirs .quote { background: rgba(0, 0, 0, .06); }
  @media (prefers-color-scheme: dark) { .bubble.theirs .quote { background: rgba(255, 255, 255, .07); } }
  .quote .q-who { display: block; font-weight: 700; font-size: var(--t-foot); }
  .bubble.theirs .quote .q-who { color: var(--accent); }
  .quote .q-text { display: block; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bubble .meta {
    display: flex; align-items: center; justify-content: flex-end; gap: 3px;
    font-size: .64rem; opacity: .72; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .bubble.theirs .meta { justify-content: flex-start; }
  .bubble .tick { display: inline-grid; place-items: center; width: 14px; height: 14px; }
  .bubble .tick .i { width: 14px; height: 14px; stroke-width: 2.4; }

  /* отправляется — пузырь чуть бледнее, часики вместо галочки */
  .bubble.pending { opacity: .62; }
  .bubble.pending .tick { animation: tick-spin 1.4s linear infinite; }
  .bubble .tick.pop { animation: tick-pop 460ms var(--spring) both; }
  @keyframes tick-spin { to { transform: rotate(360deg); } }
  @keyframes tick-pop { from { transform: scale(.2); opacity: 0; } }

  .bubble.big-emoji {
    font-size: 2.8rem; line-height: 1.12;
    background: none !important;
    padding: 2px 4px;
  }
  .bubble.big-emoji.enter { animation: emoji-pop 560ms var(--spring) both; }
  .bubble.big-emoji .meta { font-size: .62rem; color: var(--text-3); opacity: 1; }
  @keyframes emoji-pop { from { opacity: 0; transform: scale(.4) rotate(-10deg); } }

  /* ---------- «печатает» ---------- */
  .typing {
    align-self: flex-start; display: flex; gap: 4px;
    padding: 12px 14px; margin-top: 8px;
    border-radius: 20px; border-bottom-left-radius: 6px;
    background: var(--bubble-in);
    animation: bubble-in 380ms var(--spring-soft) both;
  }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-3);
    animation: dot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .16s; }
  .typing i:nth-child(3) { animation-delay: .32s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  /* ---------- кнопка «вниз» ---------- */
  .jump {
    position: absolute; right: 12px; bottom: 84px; z-index: 6;
    display: flex; align-items: center; gap: 4px;
    height: 40px; min-width: 40px; padding: 0 10px;
    border-radius: 999px;
    background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: var(--shadow-2), inset 0 0 0 .5px var(--sep);
    color: var(--text);
    font-size: var(--t-foot); font-weight: 700;
    animation: jump-in 360ms var(--spring) both;
    transition: transform var(--release);
    --ps: .88;
  }
  .jump .i { width: 20px; height: 20px; }
  @keyframes jump-in { from { opacity: 0; transform: translateY(12px) scale(.8); } }
  .jump .n {
    background: var(--heart); color: #fff;
    border-radius: 999px; padding: 2px 7px; font-size: var(--t-caption);
  }

  /* ---------- ввод ---------- */
  .quick {
    display: flex; gap: 6px; padding: 0 12px 8px; flex: none;
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
  }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex: none;
    width: 42px; height: 38px;
    border-radius: 999px;
    background: var(--fill);
    font-size: 1.15rem; line-height: 1;
    transition: transform var(--release), background-color var(--d-fast);
    --ps: .84;
  }
  /* эмодзи из быстрой панели «подпрыгивает», уходя в поле ввода */
  .quick button.hop { animation: hop 520ms var(--spring) both; }
  @keyframes hop { 0% { transform: scale(.84); } 45% { transform: translateY(-6px) scale(1.12); } 100% { transform: none; } }

  /* панель «отвечаю на…» — выезжает над полем ввода */
  .reply-bar {
    flex: none; overflow: hidden;
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px 0 16px;
    max-height: 0; opacity: 0;
    transition: max-height 280ms var(--ease-out), opacity 200ms ease, padding 280ms var(--ease-out);
  }
  .reply-bar.show { max-height: 64px; opacity: 1; padding-top: 8px; padding-bottom: 4px; }
  .reply-bar .rb-icon { color: var(--accent); flex: none; }
  .reply-bar .rb-icon .i { width: 20px; height: 20px; }
  .reply-bar .rb-body { flex: 1; min-width: 0; }
  .reply-bar .rb-who { font-size: var(--t-foot); font-weight: 700; color: var(--accent); }
  .reply-bar .rb-text { font-size: var(--t-sub); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply-bar .rb-close { width: 32px; height: 32px; color: var(--text-3); }
  .reply-bar .rb-close .i { width: 18px; height: 18px; }

  .chat-form {
    flex: none;
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: .5px solid var(--sep);
    background: var(--bar-bg);
  }
  .chat-form textarea {
    flex: 1; min-height: 40px; max-height: 128px;
    border-radius: 20px; padding: 8px 14px; resize: none;
    line-height: 1.35;
    background: var(--surface);
    border: .5px solid var(--sep);
    transition: height .18s var(--ease-out), border-color var(--d-fast);
  }
  .chat-form textarea:focus { border-color: var(--accent); }
  .send-btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    color: #fff;
    background: var(--accent-fill);
    display: grid; place-items: center;
    position: relative;
    transition: transform var(--release), opacity var(--d-fast), background-color var(--d-fast);
  }
  .send-btn .i { width: 22px; height: 22px; }
  .send-btn.empty { opacity: .35; transform: scale(.92); }
  /* Кнопка не улетает сама — она отдаёт отдачу и пускает кольцо,
     а путешествует пузырь, который из неё выходит. */
  .send-btn.launch { animation: launch 440ms var(--ease-out); }
  @keyframes launch {
    0%   { transform: none; }
    26%  { transform: scale(.82); }
    62%  { transform: scale(1.08); }
    100% { transform: none; }
  }
  .send-btn::after {
    content: ''; position: absolute; inset: -2px;
    border-radius: 50%; border: 2px solid var(--accent);
    opacity: 0; pointer-events: none;
  }
  .send-btn.launch::after { animation: send-ring 560ms var(--ease-out); }
  @keyframes send-ring {
    0%   { opacity: .7; transform: scale(.9); }
    100% { opacity: 0;  transform: scale(2); }
  }
  .send-btn { --ps: .84; }
  .send-btn.empty.is-pressed { transform: scale(.8); }

  .empty-note { text-align: center; color: var(--text-2); margin: auto; padding: 30px; line-height: 1.6; }
  .empty-note .ava { margin: 0 auto 12px; }

  .chat-note { text-align: center; margin-top: 12px; }

  @media (min-width: 721px) {
    .chat-head .back { display: none; }
    .chat-head { padding-left: 14px; }
    .chat-wrap { border-radius: 24px; box-shadow: var(--shadow-1); }
    .shell { padding-bottom: 40px; }
  }

  /* ============================================================
     Телефон: чат становится приложением на весь экран.
     Страница не скроллится, высота берётся из visualViewport —
     иначе при открытой клавиатуре поле ввода уезжает под неё.
     ============================================================ */
  @media (max-width: 720px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .shell { padding: 0; }
    /* шапка сайта не нужна: её роль играет шапка чата со стрелкой «назад» */
    .topbar { display: none; }

    /* Ключевое: высота окна чата постоянна, под клавиатуру мы его
       СДВИГАЕМ. Раньше менялась высота — а это пересчёт всей раскладки
       на каждое событие, отсюда и рывки. Сдвиг же считает видеокарта. */
    /* По умолчанию БЕЗ перехода: пока Safari анимирует клавиатуру,
       он шлёт события каждый кадр, и окно должно идти ровно за ней.
       Класс kb-anim включает доводку для одиночного скачка. */
    .chat-wrap {
      transform: translateY(var(--shift, 0px));
      will-change: transform;
    }
    body.kb-anim .chat-wrap {
      transition: transform .3s cubic-bezier(.22, .8, .24, 1);
    }
    .chat-wrap {
      position: fixed;
      left: 0; right: 0;
      top: var(--bar-h, 0px);
      height: calc(var(--app-h, 100dvh) - var(--bar-h, 0px));
      margin: 0;
      border-radius: 0;
      box-shadow: none;
      z-index: 5;
    }

    /* Шапка уезжает вместе с окном — пока печатаешь, экран отдан
       сообщениям, а как клавиатура уйдёт, она приедет обратно. */
    .chat-head { transition: opacity .24s ease; }
    body.kb-open .chat-head { opacity: 0; }

    /* Панель эмодзи убирается сразу, без анимации высоты: такая анимация
       пересчитывает раскладку каждый кадр — прямо поверх движения
       клавиатуры, отчего оно и рвётся. */
    body.kb-open .quick { display: none; }
    .bubble { max-width: 82%; }
    .chat-note { display: none; }
  }
</style>
</head>
<body data-page="chat">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#heart-fill"/></svg>Мы&nbsp;вдвоём</a>
    <nav class="nav" aria-label="Разделы">
      <span class="nav-pill" aria-hidden="true"></span>
      <a href="index.html">Главная</a>
      <a href="chat.html">Чат</a>
      <a href="letters.html">Письма</a>
      <a href="games.html">Игры</a>
      <a href="memories.html">История</a>
    </nav>
    <button class="who-chip" id="who-chip" type="button" aria-label="Сменить, кто за экраном"></button>
  </div>
</header>

<main class="shell" id="main">
  <div class="card chat-wrap">
    <div class="chat-head">
      <a class="icon-btn clear back" href="index.html" aria-label="На главную"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#back"/></svg></a>
      <span id="head-ava"></span>
      <div class="head-text">
        <div class="name" id="head-name">—</div>
        <div class="sub" id="head-sub" aria-live="polite"><span class="seen-label" id="seen-label">—</span><span class="typing-label">печатает…</span></div>
      </div>
      <button class="icon-btn" id="btn-hug" type="button" aria-label="Отправить обнимашку"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#heart"/></svg></button>
    </div>

    <div class="chat-log" id="log" role="log" aria-label="Сообщения">
      <div class="empty-note">Здесь пока пусто.<br />Напишите первое сообщение.</div>
    </div>

    <button class="jump hidden" id="jump" type="button" aria-label="К новым сообщениям"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chev-down"/></svg><span class="n" id="jump-n"></span></button>

    <div class="quick" id="quick" aria-label="Быстрые эмодзи"></div>

    <div class="reply-bar" id="reply-bar">
      <span class="rb-icon" id="rb-icon"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#reply"/></svg></span>
      <div class="rb-body">
        <div class="rb-who" id="rb-who"></div>
        <div class="rb-text" id="rb-text"></div>
      </div>
      <button class="icon-btn clear rb-close" id="rb-close" type="button" aria-label="Отменить"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#x"/></svg></button>
    </div>

    <form class="chat-form" id="form">
      <label class="visually-hidden" for="input">Сообщение</label>
      <textarea id="input" rows="1" maxlength="1200" placeholder="Сообщение"></textarea>
      <button class="send-btn empty" type="submit" id="send" aria-label="Отправить"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#up"/></svg></button>
    </form>
  </div>

  <p class="muted chat-note">Enter — отправить, Shift+Enter — новая строка · двойной клик — ❤️</p>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script type="module" src="assets/js/chat.js"></script>
