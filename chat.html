<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget: просим браузер ужимать страницу под клавиатуру,
     а не накрывать её сверху -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>Наш чат 💬</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;600&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;600&display=swap" /></noscript>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .chat-wrap {
    position: relative;              /* якорь для кнопки «вниз» */
    display: flex; flex-direction: column;
    height: min(72vh, 720px);
    padding: 0; overflow: hidden;
  }

  /* ---------- шапка чата ---------- */
  .chat-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line-soft);
    flex: none;
  }
  .chat-head .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.3rem;
    background: linear-gradient(135deg, rgba(255,94,156,.3), rgba(180,69,255,.3));
    border: 1px solid var(--line);
    flex: none;
  }
  .chat-head .name { font-weight: 800; }
  .chat-head .sub { font-size: .78rem; color: var(--text-faint); transition: color .2s; }
  .chat-head .sub.online { color: var(--mint); }

  /* ---------- лента ---------- */
  .chat-log {
    flex: 1; overflow-y: auto;
    padding: 18px 18px 8px;
    display: flex; flex-direction: column;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  /* пока сообщений мало, они лежат внизу, а не висят вверху пустого экрана */
  .chat-log::before { content: ''; margin-top: auto; }
  .chat-log::-webkit-scrollbar { width: 7px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 9px; }

  .day-sep {
    align-self: center;
    font-size: .72rem; color: var(--text-faint);
    background: rgba(0,0,0,.3); border: 1px solid var(--line-soft);
    padding: 4px 14px; border-radius: 999px;
    margin: 10px 0 6px;
  }

  /* ---------- пузыри ---------- */
  .bubble {
    max-width: min(78%, 520px);
    padding: 9px 14px 8px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: .96rem;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    position: relative;
    margin-top: 2px;
    touch-action: pan-y;            /* вертикальная прокрутка остаётся живой */
    /* Анимация висит на .enter, а не на самом пузыре: иначе она
       переигрывалась бы у всей ленты при каждом обновлении — отсюда и дёрганье. */
  }
  .bubble.enter { animation: bubble-in .42s cubic-bezier(.16, 1.1, .3, 1); }
  .bubble.swiping { transition: none; }
  .bubble.releasing { transition: transform .34s cubic-bezier(.16, 1.4, .3, 1); }
  .bubble.flash { animation: flash 1.1s ease; }

  /* сообщения одного человека подряд — слитной группой, как в мессенджерах */
  .bubble.group-start { margin-top: 10px; }

  .bubble.mine {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff5e9c, #b445ff);
    color: #fff;
    border-bottom-right-radius: 18px;
    transform-origin: bottom right;
  }
  .bubble.mine.group-end { border-bottom-right-radius: 6px; }

  .bubble.theirs {
    align-self: flex-start;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-bottom-left-radius: 18px;
    transform-origin: bottom left;
  }
  .bubble.theirs.group-end { border-bottom-left-radius: 6px; }

  @keyframes bubble-in {
    0%   { opacity: 0; transform: translateY(20px) scale(.82); }
    55%  { opacity: 1; transform: translateY(-2px) scale(1.02); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 212, 121, 0); }
    25%      { box-shadow: 0 0 0 4px rgba(255, 212, 121, .55); }
  }

  /* стрелка ответа, проявляется по мере свайпа */
  .bubble .swipe-arrow {
    position: absolute; top: 50%; left: -40px;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: .95rem;
    background: rgba(255,255,255,.1); border: 1px solid var(--line);
    pointer-events: none;
    opacity: var(--sw, 0);
    transform: translateY(-50%) scale(calc(.5 + var(--sw, 0) * .5));
  }
  .bubble.theirs .swipe-arrow { left: auto; right: -40px; }

  /* кнопка ответа для мыши */
  .bubble .reply-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    left: -36px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--glass-strong); border: 1px solid var(--line);
    color: var(--text-dim); font-size: .8rem;
    opacity: 0; transition: opacity .18s, transform .18s;
  }
  .bubble.theirs .reply-btn { left: auto; right: -36px; }
  .bubble:hover .reply-btn { opacity: 1; }
  .bubble .reply-btn:hover { transform: translateY(-50%) scale(1.15); color: var(--text); }
  @media (pointer: coarse) { .bubble .reply-btn { display: none; } }

  /* цитата внутри пузыря */
  .quote {
    display: block; cursor: pointer;
    margin: -1px 0 7px; padding: 5px 9px;
    border-left: 3px solid currentColor;
    border-radius: 7px;
    background: rgba(0, 0, 0, .22);
    font-size: .82rem; line-height: 1.35;
    transition: background .18s;
  }
  .bubble.theirs .quote { background: rgba(255, 255, 255, .06); }
  .quote:hover { background: rgba(0, 0, 0, .34); }
  .quote .q-who { display: block; font-weight: 800; opacity: .95; margin-bottom: 1px; }
  .quote .q-text { display: block; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bubble .meta {
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
    font-size: .66rem; opacity: .7; margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .bubble.theirs .meta { justify-content: flex-start; }
  .bubble .tick { font-size: .7rem; }

  /* отправляется — пузырь чуть бледнее, часики вместо галочки */
  .bubble { transition: opacity .3s ease; }
  .bubble.pending { opacity: .62; }
  .bubble .tick { display: inline-block; transition: transform .3s cubic-bezier(.16,1.4,.3,1); }
  .bubble.pending .tick { animation: tick-spin 1.4s linear infinite; }
  .bubble .tick.pop { animation: tick-pop .42s cubic-bezier(.16,1.4,.3,1); }
  @keyframes tick-spin { to { transform: rotate(360deg); } }
  @keyframes tick-pop { 0% { transform: scale(0) rotate(-90deg); } 60% { transform: scale(1.35); } 100% { transform: none; } }

  .bubble.big-emoji {
    font-size: 2.7rem; line-height: 1.15;
    background: none !important; border: none !important;
    padding: 2px 6px;
    animation: emoji-pop .45s cubic-bezier(.2, .9, .3, 1.5);
  }
  .bubble.big-emoji .meta { font-size: .62rem; }
  @keyframes emoji-pop { from { opacity: 0; transform: scale(.3) rotate(-12deg); } }

  /* ---------- «печатает» ---------- */
  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 13px 16px; margin-top: 6px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--pink-soft);
    animation: dot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-5px); } }

  /* ---------- кнопка «вниз» ---------- */
  .jump {
    position: absolute; right: 16px; bottom: 92px; z-index: 6;
    display: flex; align-items: center; gap: 6px;
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    background: rgba(36, 16, 65, .96);
    border: 1px solid var(--line);
    color: var(--text); font-size: .82rem; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    animation: bubble-in .3s ease;
  }
  .jump:hover { background: rgba(48, 22, 84, .98); }
  .jump .n {
    background: linear-gradient(135deg, var(--pink), var(--violet));
    border-radius: 999px; padding: 1px 7px; font-size: .74rem;
  }

  /* ---------- ввод ---------- */
  .quick {
    display: flex; gap: 7px; padding: 0 16px 10px; flex: none;
    flex-wrap: wrap;
  }
  .quick button {
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    font-size: 1rem; line-height: 1; transition: transform .15s, background .15s;
  }
  .quick button:hover { transform: translateY(-2px); background: var(--glass-strong); }
  .quick button:active { transform: scale(.9); }

  /* панель «отвечаю на…» — выезжает над полем ввода */
  .reply-bar {
    flex: none; overflow: hidden;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
    max-height: 0; opacity: 0;
    border-top: 0 solid var(--line-soft);
    transition: max-height .28s cubic-bezier(.2,.9,.3,1), opacity .22s, padding .28s;
  }
  .reply-bar.show {
    max-height: 64px; opacity: 1;
    padding: 10px 16px;
    border-top-width: 1px;
  }
  .reply-bar .rb-line { width: 3px; align-self: stretch; border-radius: 3px; background: var(--pink); flex: none; }
  .reply-bar .rb-body { flex: 1; min-width: 0; }
  .reply-bar .rb-who { font-size: .76rem; font-weight: 800; color: var(--pink-soft); }
  .reply-bar .rb-text { font-size: .84rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply-bar .rb-close {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: none; border: none; cursor: pointer; color: var(--text-faint);
    display: grid; place-items: center; font-size: .95rem;
    transition: background .15s, color .15s, transform .15s;
  }
  .reply-bar .rb-close:hover { background: rgba(255,255,255,.09); color: var(--text); transform: rotate(90deg); }

  .chat-form {
    flex: none;
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 14px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line-soft);
    background: rgba(0,0,0,.22);
  }
  .chat-form textarea {
    flex: 1; min-height: 46px; max-height: 128px;
    border-radius: 22px; padding: 12px 16px; resize: none;
  }
  .send-btn {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 1.1rem; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    box-shadow: 0 8px 22px rgba(255,94,156,.35);
    transition: transform .18s cubic-bezier(.2,.9,.3,1.4), opacity .2s;
    display: grid; place-items: center;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn.empty { opacity: .45; }
  .send-btn.launch { animation: launch .4s cubic-bezier(.3,.9,.4,1.3); }
  @keyframes launch {
    35% { transform: translate(6px, -6px) scale(1.16) rotate(-12deg); }
    100% { transform: none; }
  }

  .empty-note { text-align: center; color: var(--text-faint); margin: auto; padding: 30px; line-height: 1.7; }

  /* ============================================================
     Телефон: чат становится приложением на весь экран.
     Страница не скроллится, высота берётся из visualViewport —
     иначе при открытой клавиатуре поле ввода уезжает под неё.
     ============================================================ */
  @media (max-width: 720px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .shell { padding: 0; }
    .chat-page-head { display: none; }

    /* Сдвигаем всё на --vvtop: iOS не ужимает страницу под клавиатуру,
       а опускает видимую область, и закреплённые элементы иначе
       остаются висеть за краем экрана. */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      transform: translateY(var(--vvtop, 0px));
    }
    .chat-wrap {
      position: fixed;
      left: 0; right: 0; top: 0;
      transform: translateY(calc(var(--vvtop, 0px) + var(--head-h, 96px)));
      height: calc(var(--vvh, 100dvh) - var(--head-h, 96px));
      margin: 0;
      border-radius: 0;
      border-left: 0; border-right: 0; border-bottom: 0;
      z-index: 5;
    }

    /* Пока печатаешь, меню сайта прячется — на 430 точках высоты
       каждая строка на счету, а вернётся оно сразу после клавиатуры. */
    body.kb-open .topbar { transform: translateY(calc(var(--vvtop, 0px) - 100%)); }
    body.kb-open .quick { display: none; }
    .chat-log { padding: 14px 14px 4px; }
    .bubble { max-width: 84%; }
    /* одна прокручиваемая строка вместо двух — экономим высоту под клавиатурой */
    .quick {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      padding: 0 14px 8px;
      mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
    }
    .quick::-webkit-scrollbar { display: none; }
    .quick button { flex: none; }
    .jump { bottom: 88px; }
    .chat-note { display: none; }
  }
</style>
</head>
<body>

<div id="starfield"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="dot">💜</span> Мы&nbsp;вдвоём</a>
    <nav class="nav">
      <a href="index.html" class="nav-home">Главная</a>
      <a href="chat.html">Чат</a>
      <a href="letters.html">Письма</a>
      <a href="games.html">Игры</a>
      <a href="memories.html">История</a>
      <a href="quest.html">Сюрприз</a>
    </nav>
    <button class="who-chip" id="who-chip">💜</button>
  </div>
</header>

<main class="shell">
  <section class="section" style="padding-top:34px">
    <div class="section-head chat-page-head">
      <h2>Наш чат</h2>
      <p>общая лента — то, что напишете, увидите оба</p>
      <span class="badge" id="cloud-badge" style="margin-left:auto"></span>
    </div>

    <div class="card chat-wrap">
      <div class="chat-head">
        <div class="avatar" id="head-ava">💙</div>
        <div style="flex:1; min-width:0">
          <div class="name" id="head-name">—</div>
          <div class="sub" id="head-sub">—</div>
        </div>
        <span class="badge" id="cloud-badge-m" style="display:none"></span>
        <button class="btn ghost small" id="btn-hug" title="Отправить обнимашку">🫂</button>
      </div>

      <div class="chat-log" id="log">
        <div class="empty-note">Здесь пока пусто.<br />Напишите первое сообщение 💜</div>
      </div>

      <button class="jump hidden" id="jump">↓ <span class="n" id="jump-n"></span></button>

      <div class="quick" id="quick"></div>

      <div class="reply-bar" id="reply-bar">
        <div class="rb-line"></div>
        <div class="rb-body">
          <div class="rb-who" id="rb-who"></div>
          <div class="rb-text" id="rb-text"></div>
        </div>
        <button class="rb-close" id="rb-close" type="button" title="Отменить ответ">✕</button>
      </div>

      <form class="chat-form" id="form">
        <textarea id="input" rows="1" maxlength="1200" placeholder="Напишите что-нибудь тёплое…"></textarea>
        <button class="send-btn empty" type="submit" id="send" title="Отправить">➤</button>
      </form>
    </div>

    <p class="muted mt chat-note">Enter — отправить, Shift+Enter — новая строка.</p>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script type="module" src="assets/js/chat.js"></script>
</body>
</html>
