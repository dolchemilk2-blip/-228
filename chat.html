<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Наш чат 💬</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;600&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;600&display=swap" /></noscript>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .chat-wrap { display: flex; flex-direction: column; height: min(72vh, 720px); padding: 0; overflow: hidden; }

  .chat-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
    flex: none;
  }
  .chat-head .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.3rem;
    background: linear-gradient(135deg, rgba(255,94,156,.3), rgba(180,69,255,.3));
    border: 1px solid var(--line);
  }
  .chat-head .name { font-weight: 800; }
  .chat-head .sub { font-size: .78rem; color: var(--text-faint); }

  .chat-log {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .chat-log::-webkit-scrollbar { width: 7px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 9px; }

  .day-sep {
    align-self: center;
    font-size: .72rem; color: var(--text-faint);
    background: rgba(0,0,0,.28); border: 1px solid var(--line-soft);
    padding: 4px 14px; border-radius: 999px;
    margin: 8px 0;
  }

  .bubble {
    max-width: min(76%, 520px);
    padding: 11px 15px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: .96rem;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    animation: bubble-in .28s ease;
    position: relative;
  }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(8px); } }

  .bubble.mine {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(255,94,156,.9), rgba(180,69,255,.85));
    border-bottom-right-radius: 6px;
    color: #fff;
  }
  .bubble.theirs {
    align-self: flex-start;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
  }
  .bubble .meta { display: block; font-size: .68rem; opacity: .65; margin-top: 5px; }
  .bubble.big-emoji { font-size: 2.6rem; background: none !important; border: none !important; padding: 2px 6px; line-height: 1.2; }

  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 12px 16px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--pink-soft);
    animation: dot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-5px); } }

  .chat-form {
    flex: none;
    display: flex; gap: 10px; align-items: flex-end;
    padding: 14px 16px;
    border-top: 1px solid var(--line-soft);
    background: rgba(0,0,0,.18);
  }
  .chat-form textarea {
    flex: 1; min-height: 46px; max-height: 130px;
    border-radius: 22px; padding: 12px 16px; resize: none;
  }
  .send-btn {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 1.15rem;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    box-shadow: 0 8px 22px rgba(255,94,156,.35);
    transition: transform .18s;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(.94); }

  .quick { display: flex; gap: 7px; padding: 0 16px 12px; flex-wrap: wrap; }
  .quick button {
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    font-size: .95rem; transition: transform .15s, background .15s;
  }
  .quick button:hover { transform: translateY(-2px); background: var(--glass-strong); }

  .empty-note { text-align: center; color: var(--text-faint); margin: auto; padding: 30px; line-height: 1.7; }
</style>
</head>
<body>

<div id="starfield"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="dot">💜</span> Мы&nbsp;вдвоём</a>
    <nav class="nav">
      <a href="index.html" class="nav-home">Главная</a>
      <a href="chat.html">Чат</a>
      <a href="letters.html">Письма</a>
      <a href="games.html">Игры</a>
      <a href="memories.html">История</a>
      <a href="quest.html">Сюрприз</a>
    </nav>
    <button class="who-chip" id="who-chip">💜</button>
  </div>
</header>

<main class="shell">
  <section class="section" style="padding-top:34px">
    <div class="section-head">
      <h2>Наш чат</h2>
      <p>общая лента — то, что напишете, увидите оба</p>
      <span class="badge" id="cloud-badge" style="margin-left:auto"></span>
    </div>

    <div class="card chat-wrap">
      <div class="chat-head">
        <div class="avatar" id="head-ava">💙</div>
        <div style="flex:1">
          <div class="name" id="head-name">—</div>
          <div class="sub" id="head-sub">—</div>
        </div>
        <button class="btn ghost small" id="btn-hug" title="Отправить обнимашку">🫂</button>
      </div>

      <div class="chat-log" id="log">
        <div class="empty-note" id="empty-note">
          Здесь пока пусто.<br />Напишите первое сообщение 💜
        </div>
      </div>

      <div class="quick" id="quick"></div>

      <form class="chat-form" id="form">
        <textarea id="input" rows="1" maxlength="1200" placeholder="Напишите что-нибудь тёплое…"></textarea>
        <button class="send-btn" type="submit" title="Отправить">➤</button>
      </form>
    </div>

    <p class="muted mt">Enter — отправить, Shift+Enter — новая строка.</p>
  </section>
</main>

<div class="footer">сделано с 💜</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script type="module" src="assets/js/chat.js"></script>
</body>
</html>
