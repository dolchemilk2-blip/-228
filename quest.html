<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Секретное послание 💌</title>
<meta name="description" content="Маленький квест с сюрпризом внутри." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 20% 20%, #2b1055 0%, #16052e 45%, #0b0220 100%);
    color: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- звёзды ---------- */
  .star {
    position: fixed;
    border-radius: 50%;
    background: #fff;
    opacity: .8;
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.8); }
    50%      { opacity: .9;  transform: scale(1.15); }
  }

  /* ---------- экраны ---------- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .8s ease;
  }
  .screen.active { opacity: 1; visibility: visible; }

  h1 { font-size: clamp(1.4rem, 5vw, 2.4rem); font-weight: 600; text-shadow: 0 2px 20px rgba(255,105,180,.45); }
  p.hint { font-size: clamp(1rem, 3.5vw, 1.2rem); color: #e6c9ff; opacity: .85; }

  /* ---------- конверт ---------- */
  .envelope {
    font-size: clamp(5rem, 22vw, 9rem);
    cursor: pointer;
    filter: drop-shadow(0 10px 30px rgba(255,105,180,.35));
    transition: transform .3s ease;
    animation: float 3.2s ease-in-out infinite;
  }
  .envelope:hover { transform: scale(1.08); }
  @keyframes float {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -14px; }
  }
  .envelope.shake { animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(6deg); }
  }

  .lock-badge {
    position: absolute;
    font-size: clamp(1.8rem, 8vw, 3rem);
    translate: 40px 30px;
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }
  .lock-badge.open { opacity: 0; transform: translateY(-40px) rotate(30deg); }

  .envelope-wrap { position: relative; display: inline-block; }

  /* ---------- ключ ---------- */
  .key {
    position: fixed;
    font-size: clamp(2.2rem, 9vw, 3.5rem);
    cursor: pointer;
    z-index: 50;
    filter: drop-shadow(0 0 14px gold);
    animation: keyfloat 2.4s ease-in-out infinite;
    transition: transform .25s ease;
  }
  .key:hover { transform: scale(1.2); }
  @keyframes keyfloat {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -12px; }
  }

  /* ---------- кнопки ---------- */
  .btn {
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ff5e9c, #b445ff);
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,94,156,.4);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 36px rgba(255,94,156,.55); }
  .btn:active { transform: scale(.97); }

  /* ---------- финал ---------- */
  .final-heart {
    font-size: clamp(4rem, 18vw, 7rem);
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,60,120,.8));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    40%      { transform: scale(1); }
    60%      { transform: scale(1.12); }
  }

  .message {
    font-size: clamp(2rem, 8vw, 4rem);
    font-weight: 800;
    background: linear-gradient(90deg, #ff9ecb, #ff5e9c, #ffd1e8, #ff5e9c);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    line-height: 1.25;
    min-height: 1.3em;
  }
  @keyframes shine { to { background-position: 300% center; } }

  .sub {
    font-size: clamp(1rem, 4vw, 1.3rem);
    color: #ffd7ec;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .sub.show { opacity: .9; }

  /* ---------- летящие сердечки ---------- */
  .fly-heart {
    position: fixed;
    bottom: -60px;
    font-size: 26px;
    animation: fly linear forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes fly {
    to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  /* ---------- кнопка назад ---------- */
  .back-link {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 70;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: .84rem;
    font-weight: 600;
    color: #e6c9ff;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(10px);
    text-decoration: none;
    transition: background .2s, transform .2s;
  }
  .back-link:hover { background: rgba(255, 255, 255, .14); transform: translateY(-1px); }

  /* ---------- конфетти-взрыв ---------- */
  .burst {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 60;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) scale(.4) rotate(220deg); opacity: 0; }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html">← на главную</a>

  <!-- Экран 1: приветствие -->
  <section class="screen active" id="screen-start">
    <div style="font-size: clamp(3.5rem, 15vw, 6rem);">✨</div>
    <h1 id="intro-title">…</h1>
    <p class="hint" id="intro-hint">…</p>
    <button class="btn" id="btn-start">Начать</button>
  </section>

  <!-- Экран 2: конверт под замком, надо найти ключ -->
  <section class="screen" id="screen-quest">
    <h1 id="quest-title">Тебе письмо! Но оно под замком&nbsp;🔒</h1>
    <p class="hint" id="quest-hint">Найди золотой ключик — он где-то на экране…</p>
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">💌</div>
      <div class="lock-badge" id="lock">🔒</div>
    </div>
  </section>

  <!-- Экран 3: финал -->
  <section class="screen" id="screen-final">
    <div class="final-heart">❤️</div>
    <div class="message" id="message"></div>
    <p class="sub" id="sub"></p>
  </section>

<script src="assets/js/config.js"></script>
<script>
(function () {
  var QUEST = (window.SITE_CONFIG && window.SITE_CONFIG.quest) || {};

  document.getElementById('intro-title').innerHTML = QUEST.intro || 'Тебе письмо 💌';
  document.getElementById('intro-hint').textContent = QUEST.hint || 'Внутри спрятано кое-что важное…';
  document.getElementById('sub').textContent = QUEST.sub || '';

  var screens = {
    start: document.getElementById('screen-start'),
    quest: document.getElementById('screen-quest'),
    final: document.getElementById('screen-final')
  };
  var envelope = document.getElementById('envelope');
  var lock = document.getElementById('lock');
  var questTitle = document.getElementById('quest-title');
  var questHint = document.getElementById('quest-hint');
  var hasKey = false;

  function show(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
  }

  /* звёздное небо */
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = 1 + Math.random() * 2.5;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    document.body.appendChild(s);
  }

  /* старт */
  document.getElementById('btn-start').addEventListener('click', function () {
    show('quest');
    setTimeout(spawnKey, 900);
  });

  /* ключ появляется в случайном месте и пару раз убегает */
  var dodges = 2;
  function spawnKey() {
    var key = document.createElement('div');
    key.className = 'key';
    key.textContent = '🗝️';
    key.setAttribute('role', 'button');
    key.setAttribute('aria-label', 'Ключ');
    placeRandom(key);
    key.addEventListener('click', function () {
      if (dodges > 0) {
        dodges--;
        questHint.textContent = dodges === 1 ? 'Ой, какой шустрый! Лови ещё раз 😄' : 'Почти! Ну давай, последний рывок!';
        placeRandom(key);
        return;
      }
      key.remove();
      gotKey();
    });
    document.body.appendChild(key);
  }

  function placeRandom(el) {
    var pad = 70;
    var x = pad + Math.random() * (window.innerWidth - pad * 2);
    var y = pad + Math.random() * (window.innerHeight - pad * 2);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  }

  function gotKey() {
    hasKey = true;
    lock.classList.add('open');
    questTitle.textContent = 'Ключ у тебя! 🎉';
    questHint.textContent = 'Теперь нажми на конверт, чтобы открыть его 💌';
  }

  /* конверт */
  envelope.addEventListener('click', function () {
    if (!hasKey) {
      envelope.classList.remove('shake');
      void envelope.offsetWidth; /* перезапуск анимации */
      envelope.classList.add('shake');
      questHint.textContent = 'Заперто! Сначала поймай ключик 🗝️';
      return;
    }
    burstAt(window.innerWidth / 2, window.innerHeight / 2);
    show('final');
    startHearts();
    typeMessage(QUEST.message || 'Я люблю тебя ❤️');
  });

  /* печатающийся текст */
  function typeMessage(text) {
    var el = document.getElementById('message');
    var i = 0;
    (function tick() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(tick, 90);
      } else {
        document.getElementById('sub').classList.add('show');
      }
    })();
  }

  /* летящие сердечки */
  var heartEmojis = ['❤️', '💖', '💘', '💕', '🩷', '💗'];
  function startHearts() {
    setInterval(function () {
      var h = document.createElement('div');
      h.className = 'fly-heart';
      h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (18 + Math.random() * 30) + 'px';
      h.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(h);
      setTimeout(function () { h.remove(); }, 9000);
    }, 350);
  }

  /* взрыв сердечек */
  function burstAt(x, y) {
    var pieces = ['❤️', '💖', '✨', '💫', '💗', '🌟'];
    for (var i = 0; i < 26; i++) {
      var p = document.createElement('div');
      p.className = 'burst';
      p.textContent = pieces[Math.floor(Math.random() * pieces.length)];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 200;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(function (el) { el.remove(); }.bind(null, p), 1000);
    }
  }
})();
</script>
</body>
</html>
