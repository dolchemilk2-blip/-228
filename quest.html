<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0ec" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0c11" />
<title>Тебе письмо</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  :root {
    --paper: #fffaf1; --paper-2: #f5e8d6; --paper-3: #ecd9c0;
    --paper-ink: #3b2f2a; --paper-ink-2: #8a7466;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #2a2420; --paper-2: #4a3d33; --paper-3: #5a4a3e; --paper-ink: #f1e8de; --paper-ink-2: #b39e8e; }
    .env-back { background: #241d18 !important; }
    .env-letter { background: #efe4d6 !important; }
  }

  html, body { height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; text-align: center; }

  .back-link {
    position: fixed; top: 12px; left: 12px; z-index: 70;
    display: inline-flex; align-items: center; gap: 2px;
    padding: 8px 14px 8px 8px;
    border-radius: 999px;
    color: var(--accent); font-weight: 600; font-size: var(--t-callout);
    background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: var(--shadow-1);
  }
  .back-link .i { width: 22px; height: 22px; }

  /* ---------- экраны: сменяют друг друга с лёгким размытием ---------- */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    padding: 72px 24px 40px;
    opacity: 0; visibility: hidden;
    filter: blur(6px);
    transform: scale(.98);
    transition: opacity 420ms ease, filter 420ms var(--ease-out), transform 520ms var(--ease-out), visibility 0s 420ms;
  }
  .screen.active { opacity: 1; visibility: visible; filter: none; transform: none; transition-delay: 0s; }

  h1 {
    font-family: var(--font-round);
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    letter-spacing: -.02em;
    max-width: 16em;
  }
  .hint { color: var(--text-2); font-size: var(--t-body); max-width: 22em; line-height: 1.45; min-height: 2.9em; }
  .hint.swap { animation: hint-swap 380ms var(--ease-out); }
  @keyframes hint-swap { from { opacity: 0; filter: blur(4px); transform: translateY(4px); } }

  .intro-mark {
    width: 84px; height: 84px; border-radius: 26px;
    display: grid; place-items: center;
    background: var(--accent-fill); color: #fff;
    box-shadow: var(--shadow-2);
    animation: float 3.4s ease-in-out infinite;
  }
  .intro-mark .i { width: 44px; height: 44px; }
  @keyframes float { 50% { transform: translateY(-8px); } }

  /* ---------- конверт ---------- */
  .envelope {
    position: relative;
    width: min(300px, 78vw); aspect-ratio: 300 / 196;
    perspective: 900px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--d-fast) var(--ease-out);
  }
  .envelope:active { transform: scale(.97); }
  .env-back, .env-front, .env-flap, .env-letter { position: absolute; }
  .env-back { inset: 0; border-radius: 10px; background: var(--paper-3); box-shadow: var(--shadow-2); }
  .env-letter {
    left: 7%; right: 7%; top: 8%; height: 84%;
    border-radius: 8px;
    background: var(--paper);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    display: grid; place-items: center;
    color: var(--heart);
    transition: transform 700ms var(--spring-soft) 260ms;
  }
  .env-letter .i { width: 30px; height: 30px; }
  .env-front {
    inset: 0; border-radius: 10px;
    background: var(--paper-2);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    z-index: 2;
  }
  .env-flap {
    left: 0; right: 0; top: 0; height: 60%;
    background: var(--paper-3);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0;
    z-index: 3;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .12));
    transition: transform 520ms var(--ease-in-out), z-index 0s 260ms;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  /* раскрытый клапан поднимается туда, где был заголовок — заголовок уступает */
  #quest-title { transition: opacity 240ms ease; }
  .opening #quest-title { opacity: 0; }
  .envelope.open .env-letter { transform: translateY(-46%); }

  /* сургучная печать — пока цела, конверт не открыть */
  .env-seal {
    position: absolute; left: 50%; top: 60%; z-index: 4;
    width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #d4435e, #9e1d3a 70%);
    color: #ffe3e8;
    box-shadow: 0 3px 8px rgba(120, 10, 40, .35), inset 0 -2px 4px rgba(0, 0, 0, .25);
    transition: transform 500ms var(--ease-in), opacity 420ms ease;
  }
  .env-seal .i { width: 26px; height: 26px; }
  .env-seal.broken { transform: translateY(40px) rotate(40deg) scale(.6); opacity: 0; }
  .envelope.shake { animation: shake 420ms ease; }
  @keyframes shake {
    20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); }
    60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); }
  }

  /* ---------- ключик ---------- */
  .key {
    position: fixed; z-index: 50;
    width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    color: var(--gold);
    box-shadow: var(--shadow-2), 0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent);
    transition: left 520ms var(--spring-soft), top 520ms var(--spring-soft), transform var(--d-press) var(--ease-out);
    animation: key-in 520ms var(--spring) both;
  }
  .key .i { width: 32px; height: 32px; }
  .key:active { transform: scale(.9); }
  @keyframes key-in { from { transform: scale(.3); opacity: 0; } }
  .key.caught { transition: left 560ms var(--ease-in-out), top 560ms var(--ease-in-out), transform 560ms var(--ease-in-out), opacity 300ms ease 400ms; transform: scale(.5) rotate(-40deg); opacity: 0; }

  /* ---------- финал: письмо целиком ---------- */
  .final-paper {
    width: min(360px, 88vw);
    padding: 26px 24px 28px;
    border-radius: 18px;
    background: var(--paper);
    color: var(--paper-ink);
    box-shadow: var(--shadow-2);
    animation: unfold 800ms var(--ease-out) both;
  }
  @keyframes unfold {
    from { clip-path: inset(0 0 88% 0 round 18px); transform: translateY(24px); }
    to   { clip-path: inset(0 0 0 0 round 18px); transform: none; }
  }
  .final-paper .heart { color: var(--heart); width: 40px; height: 40px; margin: 0 auto; animation: beat 1.3s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.14); } 40% { transform: scale(1); } 60% { transform: scale(1.08); } }
  .message {
    margin-top: 14px;
    font-family: var(--font-hand);
    font-size: clamp(2.1rem, 9vw, 2.8rem); font-weight: 700; line-height: 1.12;
    min-height: 1.2em;
  }
  .message .caret { display: inline-block; width: 2px; height: .9em; background: currentColor; margin-left: 2px; vertical-align: -.1em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { margin-top: 10px; font-family: var(--font-hand); font-size: 1.5rem; color: var(--paper-ink-2); opacity: 0; transition: opacity 1.2s ease; }
  .sub.show { opacity: 1; }
  .again { opacity: 0; transition: opacity 600ms ease 1.2s; }
  .again.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .intro-mark, .final-paper .heart { animation: none; }
    .screen { filter: none; transform: none; }
  }
</style>
</head>
<body data-page="quest">

  <a class="back-link" href="index.html"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#back"/></svg>Главная</a>

  <!-- Экран 1: приветствие -->
  <section class="screen active" id="screen-start" aria-labelledby="intro-title">
    <div class="intro-mark" aria-hidden="true"><svg class="i"><use href="assets/icons.svg#letter"/></svg></div>
    <h1 id="intro-title">…</h1>
    <p class="hint" id="intro-hint">…</p>
    <button class="btn" type="button" id="btn-start">Начать</button>
  </section>

  <!-- Экран 2: конверт под печатью, надо найти ключ -->
  <section class="screen" id="screen-quest" aria-labelledby="quest-title">
    <h1 id="quest-title">Тебе письмо. Но оно запечатано</h1>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Конверт">
      <div class="env-back"></div>
      <div class="env-letter"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#heart-fill"/></svg></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="env-seal" id="seal"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#lock"/></svg></div>
    </div>
    <p class="hint" id="quest-hint" aria-live="polite">Найди золотой ключик — он где-то на экране…</p>
  </section>

  <!-- Экран 3: финал -->
  <section class="screen" id="screen-final" aria-live="polite">
    <div class="final-paper">
      <svg class="i heart" aria-hidden="true"><use href="assets/icons.svg#heart-fill"/></svg>
      <div class="message" id="message"></div>
      <p class="sub" id="sub"></p>
    </div>
    <a class="btn tinted again" id="again" href="index.html">На главную</a>
  </section>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var QUEST = (window.SITE_CONFIG && window.SITE_CONFIG.quest) || {};
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };

  $('intro-title').innerHTML = QUEST.intro || 'Тебе письмо';
  $('intro-hint').textContent = QUEST.hint || 'Внутри спрятано кое-что важное…';
  $('sub').textContent = QUEST.sub || '';

  var screens = { start: $('screen-start'), quest: $('screen-quest'), final: $('screen-final') };
  var envelope = $('envelope');
  var seal = $('seal');
  var hint = $('quest-hint');
  var hasKey = false;
  var opening = false;

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].classList.toggle('active', k === name); });
  }

  function say(text) {
    hint.textContent = text;
    hint.classList.remove('swap');
    void hint.offsetWidth;
    hint.classList.add('swap');
  }

  $('btn-start').addEventListener('click', function () {
    show('quest');
    setTimeout(spawnKey, 700);
  });

  /* ключ появляется в случайном месте и пару раз упрыгивает */
  var dodges = 2;
  function spawnKey() {
    var key = document.createElement('button');
    key.type = 'button';
    key.className = 'key';
    key.setAttribute('aria-label', 'Золотой ключ');
    key.innerHTML = App.icon('key');
    placeRandom(key);
    key.addEventListener('click', function () {
      if (dodges > 0) {
        dodges--;
        say(dodges === 1 ? 'Ой, какой шустрый! Лови ещё раз' : 'Почти! Последний рывок!');
        placeRandom(key);
        return;
      }
      // пойман: летит к печати и ломает её
      var s = seal.getBoundingClientRect();
      key.classList.add('caught');
      key.style.left = (s.left + s.width / 2) + 'px';
      key.style.top = (s.top + s.height / 2) + 'px';
      setTimeout(function () { key.remove(); gotKey(); }, calm ? 0 : 560);
    });
    document.body.appendChild(key);
  }

  function placeRandom(el) {
    var pad = 60;
    var x = pad + Math.random() * (window.innerWidth - pad * 2);
    var y = 90 + Math.random() * (window.innerHeight - 90 - pad);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  }

  function gotKey() {
    hasKey = true;
    seal.classList.add('broken');
    $('quest-title').textContent = 'Ключ у тебя!';
    say('Теперь нажми на конверт');
    envelope.setAttribute('aria-label', 'Открыть конверт');
  }

  function openEnvelope() {
    if (opening) return;
    if (!hasKey) {
      envelope.classList.remove('shake');
      void envelope.offsetWidth;
      envelope.classList.add('shake');
      say('Запечатано! Сначала поймай ключик');
      return;
    }
    opening = true;
    screens.quest.classList.add('opening');
    envelope.classList.add('open');
    setTimeout(function () {
      show('final');
      App.rainHearts(6);
      typeMessage(QUEST.message || 'Я люблю тебя');
    }, calm ? 200 : 1100);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });

  /* текст пишется от руки, буква за буквой */
  function typeMessage(text) {
    var el = $('message');
    var chars = Array.from(text);
    var i = 0;
    function done() {
      el.textContent = text;
      $('sub').classList.add('show');
      $('again').classList.add('show');
    }
    if (calm) { done(); return; }
    (function tick() {
      if (i > chars.length) { done(); return; }
      el.innerHTML = '';
      el.appendChild(document.createTextNode(chars.slice(0, i).join('')));
      var c = document.createElement('span');
      c.className = 'caret';
      el.appendChild(c);
      i++;
      setTimeout(tick, 85);
    })();
  }
})();
</script>
</body>
</html>
