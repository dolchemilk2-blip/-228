<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Монтажка — управление доступом</title>
<meta name="theme-color" content="#1A1613">
<!-- Админка владельца: загрузка сборки, коды активации, покупатели. Пускает только почту
     владельца — это решают правила базы (access/database.rules.json), а не эта страница. -->
<script>
(function () { try {
  var d = document.documentElement, t = localStorage.getItem('montage:theme') || 'auto';
  d.setAttribute('data-scheme', t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
} catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Tektur:wdth,wght@85..100,500..800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #E4E6E1; --surface: #F8F8F6; --well: #EEEFEB; --ink: #15171A; --muted: #565D61; --line: #C6CAC3; --line2: #DDE0DA;
  --accent: #EBA51C; --accent-ink: #1B1400; --accent-soft: #F7E6BD; --accent-text: #875600; --focus: #875600;
  --ok: #1E6C42; --ok-soft: #DAEEDF; --bad: #B3261E; --bad-soft: #F6DAD6; --none-soft: #E4E6E2;
  --deck: #1A1613; --deck-2: #27211C; --deck-line: #3D342D; --deck-ink: #F0EAE2; --deck-muted: #ADA398;
  --sh-1: 0 1px 0 rgb(255 255 255 / 75%) inset, 0 1px 2px rgb(30 26 20 / 7%), 0 6px 16px -10px rgb(30 26 20 / 28%);
  --sans: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --display: "Tektur", "Golos Text", system-ui, sans-serif;
}
:root[data-scheme="dark"] {
  color-scheme: dark;
  --bg: #14110F; --surface: #1D1916; --well: #171412; --ink: #EFE9E2; --muted: #ABA197; --line: #3B332C; --line2: #2B2521;
  --accent: #F2B233; --accent-soft: #3B2D12; --accent-text: #F2B233; --focus: #F2B233;
  --ok: #6CC592; --ok-soft: #173022; --bad: #F07B6C; --bad-soft: #3D1F1B; --none-soft: #27221E;
  --deck: #0E0C0B; --deck-2: #1F1A16; --deck-line: #342C26;
  --sh-1: 0 1px 0 rgb(255 255 255 / 3%) inset, 0 1px 2px rgb(0 0 0 / 40%);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: 60px; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.top { position: sticky; top: 0; z-index: 10; background: var(--deck); color: var(--deck-ink); border-bottom: 1px solid var(--deck-line); }
.top-in { max-width: 1000px; margin: 0 auto; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { margin: 0; font: 700 20px/1 var(--display); font-stretch: 92%; }
.mark small { font: 500 13px var(--sans); color: var(--deck-muted); margin-left: 8px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--deck-muted); font-size: 13.5px; }
.who button { border: 1px solid var(--deck-line); background: var(--deck-2); color: var(--deck-ink); border-radius: 8px; min-height: 32px; padding: 0 12px; cursor: pointer; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--sh-1); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card > * { margin: 0; }
.card h2 { font: 700 18px/1.2 var(--display); }
.note { color: var(--muted); font-size: 13.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px; border: 1px solid color-mix(in srgb, var(--accent) 70%, #000); border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn.bad { color: var(--bad); }
input[type=text], input[type=number], input[type=search] { height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--well); min-width: 0; }
input[type=number] { width: 84px; }
pre { margin: 0; max-height: 260px; overflow: auto; padding: 12px; border-radius: 8px; background: var(--well); border: 1px solid var(--line); font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
details > summary { cursor: pointer; font: 700 18px/1.2 var(--display); list-style-position: inside; }
details[open] > summary { margin-bottom: 12px; }
details > :not(summary) + :not(summary) { margin-top: 12px; }
.drop { position: relative; display: grid; place-items: center; gap: 6px; min-height: 96px; padding: 16px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--well); text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.stat { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--well); border: 1px solid var(--line); }
.seg button { border: 0; background: none; border-radius: 999px; min-height: 28px; padding: 0 12px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.list { display: grid; border-top: 1px solid var(--line2); }
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.it .main { min-width: 0; display: grid; gap: 2px; }
.it .main b { overflow-wrap: anywhere; font-weight: 600; }
.it .sub { color: var(--muted); font-size: 13px; }
.it .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--none-soft); color: var(--muted); vertical-align: 1px; margin-left: 6px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent-text); }
.codes-new { font: 500 14px/1.7 var(--mono); }
.empty { color: var(--muted); padding: 10px 0; }
.msg { font-size: 13.5px; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }
.msg:empty { display: none; }
[hidden] { display: none !important; }
@media (max-width: 640px) { .it { grid-template-columns: 1fr; } .it .acts { justify-content: flex-start; } }
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 class="mark">Монтажка<small>управление доступом</small></h1><div class="who" id="who"></div></div></header>
<main class="wrap" id="app"><section class="card"><p class="note">Загружаю…</p></section></main>
<script type="module">
import * as F from './access/fb.js';
import CFG from './access/config.js';

const $ = s => document.querySelector(s), E = F.esc, app = $('#app');
const when = t => t ? new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
// адрес сайта для ссылок из магазина: папка, где лежит admin.html (или siteUrl из config.js)
const SITE = (CFG.siteUrl || location.origin + location.pathname.replace(/[^/]*$/, '')).replace(/\/?$/, '/');
const shopLink = k => SITE + '?code=' + F.fmtCode(k);
const TRIAL_MS = 5 * 86400000, trialOn = u => !!(u.trial && u.trial.start && u.trial.start + TRIAL_MS > Date.now());
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.round(n / 1024) + ' КБ';
function device(ua = '') {
  const b = /Edg\//.test(ua) ? 'Edge' : /YaBrowser/.test(ua) ? 'Яндекс' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'браузер';
  const o = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  return o ? `${b}, ${o}` : b;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => { btn.textContent = o; }, 1400); }
}

const S = { user: null, users: {}, codes: {}, meta: null, admin: false, rules: '', file: null, fresh: [], codeFilter: 'free', q: '' };

async function start() {
  if (!F.configured) { app.innerHTML = `<section class="card"><h2>Firebase не подключён</h2><p>Заполните <code>access/config.js</code> по инструкции <code>ACCESS.md</code>.</p></section>`; return; }
  let user = null;
  try { user = await F.currentUser(); } catch {}
  S.user = user;
  $('#who').innerHTML = user ? `<span>${E(user.email)}</span><button type="button" data-act="out">Выйти</button>` : '';
  if (!user) {
    app.innerHTML = `<section class="card"><h2>Вход для владельца</h2><p class="note">Войдите тем аккаунтом Google, почта которого вписана в правила базы.</p><div class="row"><button class="btn" type="button" data-act="in">Войти через Google</button></div><p class="msg bad" id="in-err"></p></section>`;
    return;
  }
  try { S.rules = (await (await fetch('access/database.rules.json', { cache: 'no-store' })).text()).replaceAll('ADMIN_EMAIL', user.email.replace(/['\\]/g, '')); } catch { S.rules = ''; }
  await reload();
}

async function reload() {
  const [u, c, m] = await Promise.allSettled([F.db('users'), F.db('codes'), F.db('app/meta')]);
  S.admin = u.status === 'fulfilled';
  if (!S.admin && u.reason && u.reason.code === 'net') { app.innerHTML = `<section class="card"><h2>Нет связи с базой</h2><p class="note">Проверьте интернет и <code>databaseURL</code> в <code>access/config.js</code>.</p><div class="row"><button class="btn" type="button" data-act="reload">Повторить</button></div></section>`; return; }
  S.users = u.value || {}; S.codes = c.value || {}; S.meta = m.value || null;
  render();
}

function rulesCard(open) {
  return `<section class="card"><details ${open ? 'open' : ''}><summary>Правила базы</summary>
    <p class="note">Firebase → Realtime Database → вкладка <b>Rules</b>: замените всё содержимое на текст ниже и нажмите <b>Publish</b>. В правила уже вписана ваша почта — так база узнаёт владельца. Публиковать заново нужно, только если этот текст поменяется.</p>
    <pre id="rules">${E(S.rules || 'Не получилось загрузить access/database.rules.json')}</pre>
    <div class="row"><button class="btn ghost" type="button" data-act="copy-rules">Скопировать правила</button></div></details></section>`;
}

function render() {
  if (!S.admin) {
    app.innerHTML = `<section class="card"><h2>Этот аккаунт — не владелец</h2><p>Вы вошли как <b>${E(S.user.email)}</b>, но база не признаёт его владельцем.</p><p class="note">Первый запуск? Опубликуйте правила ниже — в них вписана эта почта, — и обновите страницу. Если владелец другой аккаунт — выйдите и войдите им.</p><div class="row"><button class="btn ghost" type="button" data-act="reload">Проверить ещё раз</button></div></section>${rulesCard(true)}`;
    return;
  }
  const users = Object.entries(S.users).map(([uid, v]) => ({ uid, ...v })), codes = Object.entries(S.codes).map(([k, v]) => ({ k, ...v }));
  const shopAll = codes.filter(c => c.shop).length, shopSold = codes.filter(c => c.shop && c.used).length, shopLeft = codes.filter(c => c.shop && !c.used && !c.off).length;
  const paid = users.filter(u => u.paid && !u.blocked).length, free = codes.filter(c => !c.used && !c.off && !c.shop).length, trial = users.filter(u => !u.paid && !u.blocked && trialOn(u)).length;
  app.innerHTML = `
  <section class="card"><p class="stat"><span>С доступом: <b>${paid}</b></span><span>На пробе: <b>${trial}</b></span><span>Всего входили: <b>${users.length}</b></span><span>Свободных кодов: <b>${free}</b></span><span>Сборка: <b>${S.meta ? when(S.meta.t) : 'не загружена'}</b></span></p></section>
  <section class="card" id="build">
    <h2>Сборка Монтажки</h2>
    <p class="note">${S.meta ? `Сейчас загружена сборка от ${when(S.meta.t)} · ${kb(S.meta.size || 0)} · <span class="mono">${E(String(S.meta.v).slice(0, 10))}</span>. Покупатели получат новую при следующем открытии.` : 'Сборка ещё не загружена — покупатели увидят «Монтажка ещё не загружена».'}</p>
    <label class="drop" id="drop"><input type="file" id="file" accept=".html,text/html"><b>${S.file ? E(S.file.name) + ' · ' + kb(S.file.text.length) : 'Выберите файл montage.html'}</b><span class="note">${S.file ? 'Готово к загрузке' : 'или перетащите его сюда — это собранная Монтажка (dist/montage.html)'}</span></label>
    <div class="row"><button class="btn" type="button" data-act="upload" ${S.file ? '' : 'disabled'}>Загрузить сборку</button><span class="msg" id="up-msg"></span></div>
  </section>
  <section class="card" id="shop">
    <h2>Продажа через магазин</h2>
    <p class="note">Магазин продаёт ссылки: каждому покупателю — одна строка из списка, сразу после оплаты на экране и на почту. Покупатель открывает ссылку, входит через Google — покупка активируется сама. Выгрузите ссылки и добавьте их в товар магазина («уникальный товар», «serials»). Кнопка «Купить» на сайте ведёт на этот товар (<code>buyUrl</code> в <code>access/config.js</code>${CFG.buyUrl ? ': ' + E(CFG.buyUrl) : ' — пока не задан'}).</p>
    <p class="stat"><span>В магазине осталось: <b>${shopLeft}</b></span><span>Продано: <b>${shopSold}</b></span><span>Выгружено всего: <b>${shopAll}</b></span></p>
    ${shopAll && shopLeft < 10 ? `<p class="msg bad">Ссылок в магазине осталось мало — выгрузите ещё и добавьте в товар, иначе магазин перестанет продавать.</p>` : ''}
    <form class="row" data-form="shop"><label>Сколько ссылок <input type="number" name="n" min="1" max="500" value="50"></label><button class="btn" type="submit">Выгрузить ссылки для магазина</button></form>
    <p class="note">Ссылки ведут на <span class="mono">${E(SITE)}</span>. Каждая ссылка — отдельный новый код: выгруженные не смешиваются с кодами, которые вы раздаёте сами.</p>
  </section>
  <section class="card" id="codes">
    <h2>Коды активации</h2>
    <p class="note">Один код — один аккаунт. Отдайте код покупателю (магазин, Telegram, письмо); он входит через Google и вводит код — доступ откроется сразу.</p>
    <form class="row" data-form="make"><label>Сколько <input type="number" name="n" min="1" max="200" value="5"></label><input type="text" name="note" placeholder="пометка, например: продажа в Boosty" maxlength="80" style="flex:1"><button class="btn" type="submit">Создать коды</button></form>
    ${S.fresh.length ? `<div class="card" style="box-shadow:none;background:var(--well)"><p class="codes-new">${S.fresh.map(F.fmtCode).join('<br>')}</p><div class="row"><button class="btn ghost small" type="button" data-act="copy-fresh">Скопировать новые (${S.fresh.length})</button></div></div>` : ''}
    <div class="row"><span class="seg" role="group" aria-label="Какие коды показать">${[['free', 'Свободные'], ['shop', 'В магазине'], ['used', 'Активированные'], ['off', 'Отключённые'], ['all', 'Все']].map(([k, t]) => `<button type="button" data-filter="${k}" aria-pressed="${S.codeFilter === k}">${t}</button>`).join('')}</span>${S.codeFilter === 'free' && free ? `<button class="btn ghost small" type="button" data-act="copy-free">Скопировать свободные</button>` : ''}</div>
    <div class="list">${codeRows(codes) || '<p class="empty">Здесь пока пусто.</p>'}</div>
  </section>
  <section class="card" id="users">
    <h2>Покупатели</h2>
    <p class="note">Все, кто входил. Оплатил переводом без кода — нажмите «Выдать доступ». «Отключить» закрывает доступ сразу, даже в открытой вкладке (в течение минуты). Пробный период — 5 дней: всё работает, но скачивать файлы можно только за приглашения (3 за каждого друга, начавшего пробу по ссылке, до 10 друзей).</p>
    <input type="search" id="q" placeholder="Поиск по почте или имени" value="${E(S.q)}" aria-label="Поиск покупателей">
    <div class="list" id="ulist">${userRows(users) || '<p class="empty">Пока никто не входил.</p>'}</div>
  </section>
  ${rulesCard(false)}`;
}

function codeRows(codes) {
  const f = S.codeFilter, st = c => c.used ? 'used' : c.off ? 'off' : c.shop ? 'shop' : 'free';
  return codes.filter(c => f === 'all' || st(c) === f).sort((a, b) => (b.t || 0) - (a.t || 0)).map(c => `<div class="it"><div class="main"><b class="mono">${F.fmtCode(c.k)}${c.used ? `<span class="chip ok">${c.shop ? 'продан' : 'активирован'}</span>` : c.off ? '<span class="chip bad">отключён</span>' : c.shop ? '<span class="chip acc">в магазине</span>' : '<span class="chip acc">свободен</span>'}</b>
    <span class="sub">${c.used ? `${E(c.used.email || '')} · ${when(c.used.at)}` : `создан ${when(c.t)}`}${c.note ? ' · ' + E(c.note) : ''}</span></div>
    <div class="acts">${c.used ? '' : `<button class="btn ghost small" type="button" data-copy="${c.k}"${c.shop ? ' data-link="1"' : ''}>${c.shop ? 'Копировать ссылку' : 'Копировать'}</button><button class="btn ghost small" type="button" data-code-off="${c.k}">${c.off ? 'Включить' : 'Отключить'}</button>`}</div></div>`).join('');
}
function userRows(users) {
  const q = S.q.trim().toLowerCase();
  return users.filter(u => !q || (u.email || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q)).sort((a, b) => (b.seen || 0) - (a.seen || 0)).map(u => {
    const tr = u.trial && u.trial.start ? (trialOn(u) ? `<span class="chip acc">проба до ${new Date(u.trial.start + TRIAL_MS).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })}</span>` : '<span class="chip">проба закончилась</span>') : '';
    const chip = u.blocked ? '<span class="chip bad">отключён</span>' : u.paid ? `<span class="chip ok">${u.code ? 'доступ по коду' : 'доступ выдан'}</span>` : tr || '<span class="chip">без доступа</span>';
    const act = u.blocked ? `<button class="btn ghost small" type="button" data-user="${u.uid}" data-do="unblock">Вернуть доступ</button>`
      : u.paid ? `<button class="btn ghost small bad" type="button" data-user="${u.uid}" data-do="block">Отключить</button>`
      : `<button class="btn small" type="button" data-user="${u.uid}" data-do="grant">Выдать доступ</button>${u.trial ? `<button class="btn ghost small" type="button" data-user="${u.uid}" data-do="extend" title="Пробный период заново на 5 дней с сегодняшнего дня">Продлить пробу</button>` : ''}`;
    const inv = u.bonus ? ` · пригласил: ${u.bonus}` : '', exp = !u.paid && (u.bonus || u.exports) ? ` · скачиваний ${u.exports || 0} из ${Math.min(10, u.bonus || 0) * 3}` : '';
    const from = u.trial && u.trial.ref ? ` · по приглашению ${E((S.users[u.trial.ref] || {}).email || u.trial.ref.slice(0, 8) + '…')}` : '';
    return `<div class="it"><div class="main"><b>${E(u.email || u.uid)}${chip}</b><span class="sub">${u.name ? E(u.name) + ' · ' : ''}впервые ${when(u.first)} · был ${when(u.seen)}${u.session ? ' · ' + device(u.session.ua) : ''}${u.code ? ' · код ' + F.fmtCode(u.code).slice(0, 9) + '…' : ''}${inv}${exp}${from}</span></div><div class="acts">${act}</div></div>`;
  }).join('');
}

async function upload() {
  const f = S.file, msg = $('#up-msg'), btn = $('[data-act=upload]');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Загружаю…';
  try {
    const PART = 1000000, parts = [];
    for (let i = 0; i < f.text.length; i += PART) parts.push(f.text.slice(i, i + PART));
    const meta = { v: await F.sha256(f.text), size: f.text.length, bytes: new TextEncoder().encode(JSON.stringify(parts)).length, parts: parts.length, name: f.name.slice(0, 100), t: F.TS };
    await F.db('app', { method: 'PUT', body: { meta, parts } });
    S.file = null;
    await reload();
    const m = $('#up-msg'); m.className = 'msg ok'; m.textContent = 'Готово: сборка загружена.';
  } catch (e) {
    btn.disabled = false; msg.className = 'msg bad';
    msg.textContent = e.code === 'denied' ? 'База не пустила: проверьте, что правила опубликованы с вашей почтой.' : 'Не получилось загрузить: ' + e.message;
  }
}
async function pickFile(file) {
  if (!file) return;
  const text = await file.text(), msg = () => $('#up-msg');
  if (!/<title>Монтажка<\/title>/.test(text) || !/<script type="module">/.test(text) || /access\/fb\.js/.test(text)) {
    S.file = null; render(); const m = msg(); m.className = 'msg bad'; m.textContent = 'Это не сборка Монтажки. Нужен файл dist/montage.html (не index.html со страницей входа).'; return;
  }
  S.file = { name: file.name, text }; render();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'in') { b.disabled = true; try { await F.signIn(); start(); } catch (err) { b.disabled = false; $('#in-err').textContent = F.authError(err); } return; }
  if (a === 'out') { await F.signOut(); S.fresh = []; start(); return; }
  if (a === 'reload') return reload();
  if (a === 'copy-rules') return copy(S.rules, b);
  if (a === 'upload') return upload();
  if (a === 'copy-fresh') return copy(S.fresh.map(F.fmtCode).join('\n'), b);
  if (a === 'copy-free') return copy(Object.entries(S.codes).filter(([, c]) => !c.used && !c.off && !c.shop).map(([k]) => F.fmtCode(k)).join('\n'), b);
  if (b.dataset.filter) { S.codeFilter = b.dataset.filter; render(); $(`[data-filter="${S.codeFilter}"]`).focus(); return; }
  if (b.dataset.copy) return copy(b.dataset.link ? shopLink(b.dataset.copy) : F.fmtCode(b.dataset.copy), b);
  if (b.dataset.codeOff) { const k = b.dataset.codeOff; b.disabled = true; await F.db(`codes/${k}/off`, { method: 'PUT', body: S.codes[k].off ? null : true }).catch(() => {}); return reload(); }
  if (b.dataset.user) {
    const uid = b.dataset.user, u = S.users[uid] || {}, d = b.dataset.do;
    if (d === 'block' && !confirm(`Отключить доступ для ${u.email || uid}?`)) return;
    b.disabled = true;
    const body = d === 'grant' ? { paid: true, manual: true, blocked: null } : d === 'block' ? { blocked: true } : d === 'extend' ? { 'trial/start': F.TS } : { blocked: null, paid: true };
    await F.db('users/' + uid, { method: 'PATCH', body }).catch(() => {});
    return reload();
  }
});
/** Ссылки для магазина: новые коды с пометкой «магазин» и файл, где каждая строка — ссылка с кодом. */
async function shopExport(f) {
  const n = Math.max(1, Math.min(500, Math.round(+f.n.value || 1))), btn = f.querySelector('button'), batch = {}, keys = [];
  btn.disabled = true;
  for (let i = 0; i < n; i++) { const k = F.newCode(); if (S.codes[k] || batch[k]) { i--; continue; } batch[k] = { t: F.TS, shop: F.TS, note: 'магазин' }; keys.push(k); }
  try {
    await F.db('codes', { method: 'PATCH', body: batch });
    const d = new Date(), name = `монтажка-ссылки-${d.toISOString().slice(0, 10)}-${n}.txt`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([keys.map(shopLink).join('\n') + '\n'], { type: 'text/plain;charset=utf-8' })); a.download = name;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    S.codeFilter = 'shop';
  } catch { alert('Не получилось выгрузить — проверьте связь.'); }
  btn.disabled = false; reload();
}
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.dataset.form === 'shop') return shopExport(e.target);
  const f = e.target, n = Math.max(1, Math.min(200, Math.round(+f.n.value || 1))), note = f.note.value.trim().slice(0, 80), btn = f.querySelector('button');
  btn.disabled = true;
  const batch = {}, fresh = [];
  for (let i = 0; i < n; i++) { const k = F.newCode(); if (S.codes[k]) { i--; continue; } batch[k] = { t: F.TS, ...(note ? { note } : {}) }; fresh.push(k); }
  try { await F.db('codes', { method: 'PATCH', body: batch }); S.fresh = fresh; S.codeFilter = 'free'; }
  catch { alert('Не получилось создать коды — проверьте связь.'); }
  reload();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#ulist').innerHTML = userRows(Object.entries(S.users).map(([uid, v]) => ({ uid, ...v }))) || '<p class="empty">Никого не нашлось.</p>'; }
});
document.addEventListener('change', e => { if (e.target.id === 'file') pickFile(e.target.files[0]); });
for (const ev of ['dragenter', 'dragover']) document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); pickFile(e.dataTransfer.files[0]); } });
if (F.EMU) window.__montageAdmin = { signIn: async email => { await F.emuSignIn(email); start(); } };
start();
</script>
