<meta name="theme-color" content="#1A1613">
<!-- Страница входа. Сама Монтажка лежит в базе Firebase и приходит сюда только после входа
     аккаунтом, у которого есть доступ (код активации или выдан вручную). Как всё устроено — ACCESS.md. -->
<script>
/* оформление — как в самой Монтажке, чтобы при входе не мелькала другая тема */
(function () { try {
  var d = document.documentElement, g = function (k) { try { return localStorage.getItem('montage:' + k); } catch (e) { return null; } };
  var t = g('theme') || 'auto', p = g('palette'), c = g('contrast'), m = g('motion'), mm = function (q) { return window.matchMedia && matchMedia(q).matches; };
  if (t !== 'auto') d.setAttribute('data-theme', t);
  if (p && p !== 'amber') d.setAttribute('data-palette', p);
  if (c === 'more' || (!c && mm('(prefers-contrast: more)'))) d.setAttribute('data-contrast', 'more');
  if (m === 'reduce') d.setAttribute('data-motion', 'reduce');
  d.setAttribute('data-scheme', t === 'dark' || (t !== 'light' && mm('(prefers-color-scheme: dark)')) ? 'dark' : 'light');
} catch (e) {} })();
</script>

<style id="g-keep">

.g-lock-card .g-in input:focus-visible { outline: 2px solid var(--focus, #875600); outline-offset: 0; }
.g-lock-card .g-in button { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line, #C6CAC3); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.g-lock-card .g-in button:focus-visible { outline: 2px solid var(--focus, #875600); outline-offset: 2px; }

<div class="g-wrap">
  <main class="g-card" id="g-card">
    <div class="g-head">
      <svg class="g-reels" viewBox="0 0 40 24" aria-hidden="true">
        <path d="M9 22.4h22" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <g class="reel"><circle cx="9" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="6.7" r="1.7" fill="currentColor" opacity=".7"/><circle cx="4.4" cy="14.6" r="1.7" fill="currentColor" opacity=".7"/><circle cx="13.6" cy="14.6" r="1.7" fill="currentColor" opacity=".7"/><circle class="hub" cx="9" cy="12" r="2.2"/></g>
        <g class="reel"><circle cx="31" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="31" cy="6.7" r="1.7" fill="currentColor" opacity=".7"/><circle cx="26.4" cy="14.6" r="1.7" fill="currentColor" opacity=".7"/><circle cx="35.6" cy="14.6" r="1.7" fill="currentColor" opacity=".7"/><circle class="hub" cx="31" cy="12" r="2.2"/></g>
      </svg>
      <div>
        <h1 class="g-mark">Монтажка</h1>
        <p class="g-sub">сборка радиоспектакля</p>
      </div>
    </div>
    <div class="g-body" id="g-view" aria-live="polite">
      <p class="g-state"><span class="g-dot"></span>Загружаю…</p>
      <noscript><p class="g-err">Для Монтажки нужен включённый JavaScript.</p></noscript>
    </div>
  </main>
  <p class="g-foot" id="g-foot"></p>
</div>
<script type="module">
import * as F from './access/fb.js';
import CFG from './access/config.js';

const $ = s => document.querySelector(s), E = F.esc;
// пробный период: 5 дней всё работает и слушается; скачивать — после покупки или за приглашения (3 за друга, до 10 друзей)
const TRIAL_MS = 5 * 86400000, PER_INVITE = 3, MAX_INVITES = 10;
const REF = (() => { try { const r = new URLSearchParams(location.search).get('ref'); if (r && /^[A-Za-z0-9_-]{6,128}$/.test(r)) localStorage.setItem('montage-access:ref', r); return localStorage.getItem('montage-access:ref') || ''; } catch { return ''; } })();
const ACC = { user: null, me: {}, plan: 'paid' };
// ссылка из магазина: …/montage/?code=XXXX-XXXX-XXXX-XXXX — код запоминается до входа и активируется сам
const PAY = {
  get() { try { return localStorage.getItem('montage-access:code') || ''; } catch { return PAY.mem || ''; } },
  set(k) { PAY.mem = k; try { localStorage.setItem('montage-access:code', k); } catch {} },
  drop() { PAY.mem = ''; try { localStorage.removeItem('montage-access:code'); } catch {} },
};
(() => { try { const u = new URL(location.href), c = u.searchParams.get('code'); if (c == null) return; const k = F.normCode(c); if (F.okCode(k)) PAY.set(k); u.searchParams.delete('code'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch {} })();
// другая вкладка активировала покупку — эта узнаёт сразу, не дожидаясь опроса
const BC = 'BroadcastChannel' in window ? new BroadcastChannel('montage-access') : null;
const trialLeft = m => m && m.trial && typeof m.trial.start === 'number' ? m.trial.start + TRIAL_MS - Date.now() : -1;
// подписка: until — оплаченные месяцы (коды из магазина), grant — продление владельцем из admin.html
const subEnd = m => Math.max((m && typeof m.until === 'number' && m.until) || 0, (m && typeof m.grant === 'number' && m.grant) || 0);
const subLeft = m => subEnd(m) ? subEnd(m) - Date.now() : -1;
const planOf = m => m.paid ? 'paid' : subLeft(m) > 0 ? 'sub' : trialLeft(m) > 0 ? 'trial' : 'admin';
const exportsLeft = m => Math.max(0, Math.min(MAX_INVITES, (m && m.bonus) || 0) * PER_INVITE - ((m && m.exports) || 0));
const plural = (n, a, b, c) => { const k = n % 100, j = n % 10; return k > 10 && k < 20 ? c : j === 1 ? a : j > 1 && j < 5 ? b : c; };
const daysTxt = ms => { const d = Math.ceil(ms / 86400000); return d <= 1 ? 'последний день' : `${d} ${plural(d, 'день', 'дня', 'дней')}`; };
const dateTxt = t => new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
const inviteUrl = uid => location.origin + location.pathname.replace(/[^/]*$/, '') + '?ref=' + encodeURIComponent(uid);
const view = $('#g-view'), card = $('#g-card');
const reduced = () => document.documentElement.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const contact = CFG.contact ? `Вопросы и помощь: ${/^@|^https?:/.test(CFG.contact) ? `<a href="${E(/^@/.test(CFG.contact) ? 'https://t.me/' + CFG.contact.slice(1) : CFG.contact)}" target="_blank" rel="noopener">${E(CFG.contact)}</a>` : /@/.test(CFG.contact) ? `<a href="mailto:${E(CFG.contact)}">${E(CFG.contact)}</a>` : E(CFG.contact)}` : '';
$('#g-foot').innerHTML = contact;
const buy = CFG.buyUrl ? `<a class="g-buy" href="${E(CFG.buyUrl)}" target="_blank" rel="noopener">Купить Монтажку</a>` : '';
/** «Купить»: оплата в окне поверх сайта; магазин сразу после оплаты показывает ссылку с кодом. */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a.g-buy'); if (!a) return;
  const w = Math.min(560, screen.availWidth - 20), h = Math.min(820, screen.availHeight - 40);
  const win = window.open(a.href, 'montage-buy', `popup,width=${w},height=${h},left=${Math.max(0, (screen.availWidth - w) / 2)},top=${Math.max(0, (screen.availHeight - h) / 2)}`);
  if (!win) return;                                                   // окна запрещены — откроется обычной вкладкой
  e.preventDefault(); try { win.opener = null; } catch {}
  const note = a.closest('.g-lock-card, .g-body')?.querySelector('.g-paynote');
  if (note) note.hidden = false;
});
const payNote = `<p class="g-note g-paynote" hidden>Оплатите в открывшемся окне — магазин сразу покажет ссылку и пришлёт её на почту. Откройте ссылку, и Монтажка откроется сама.</p>`;
// встроенные браузеры приложений (Instagram, TikTok…) часто не пускают во вход Google
const inApp = /Instagram|FBAN|FBAV|TikTok|musical_ly|Line\/|; wv\)/i.test(navigator.userAgent);

const T = {
  wait: t => `<p class="g-state"><span class="g-dot"></span>${t}</p>`,
  setup: () => `<p class="g-lead">Сайт ещё не подключён к Firebase.</p><p class="g-note">Владельцу: заполните <code>access/config.js</code> по инструкции <code>montage/ACCESS.md</code>.</p>`,

function show(html) {
  const hadFocus = view.contains(document.activeElement);
  view.innerHTML = html;
  card.classList.toggle('g-busy', /g-dot/.test(html));
  if (!reduced()) view.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 250, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
  const f = view.querySelector('input, button');
  if (f && (hadFocus || f.tagName === 'INPUT')) f.focus({ preventScroll: true });
}
const setErr = (t, sel = '.g-err') => { const e = view.querySelector(sel); if (e) e.textContent = t; };

// ---------------------------------------------------------------- устройство
// Работать можно на одном устройстве за раз: у каждого браузера свой номер сессии, в базе — последний вошедший.
const rnd = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');
let memSid = '';
function sidOf(uid) {
  try { let s = localStorage.getItem('montage-access:sid:' + uid); if (!s) { s = rnd(); localStorage.setItem('montage-access:sid:' + uid, s); } return s; }
  catch { return memSid || (memSid = rnd()); }
}
const claim = (user, sid) => F.db(`users/${user.uid}/session`, { method: 'PUT', body: { id: sid, t: F.TS, ua: navigator.userAgent.slice(0, 200) }, user });

// ---------------------------------------------------------------- сохранённая сборка (чтобы не качать заново каждый раз)
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('montage-access', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function cache(op, val) {
  try {
    const d = await idb();
    return await new Promise(res => {
      const tx = d.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');
      const q = op === 'get' ? st.get('app') : op === 'put' ? st.put(val, 'app') : st.delete('app');
      tx.oncomplete = () => res(op === 'get' ? q.result || null : true);
      tx.onerror = tx.onabort = () => res(null);
    });
  } catch { return null; }
}

// ---------------------------------------------------------------- вход и проверка доступа
async function start() {
  if (!F.configured) return show(T.setup());
  show(T.wait('Проверяю вход…'));
  let user;
  try { user = await F.currentUser(); } catch { return show(T.err('Не получилось связаться с сервером входа. Проверьте интернет.')); }
  if (!user) return show(T.out());
  enter(user);
}

async function enter(user) {
  show(T.wait('Проверяю доступ…'));
  const [me, meta] = await Promise.allSettled([F.db('users/' + user.uid, { user }), F.db('app/meta', { user })]);
  if (me.status === 'rejected') return show(me.reason.code === 'denied' ? T.closed() : T.err('Нет связи с сервером. Проверьте интернет.'));
  let m = me.value || {};
  const pend = PAY.get();
  if (pend && m.paid) PAY.drop();                                   // доступ уже есть — код остаётся неиспользованным
  else if (pend && !m.blocked) {
    show(T.wait('Активирую покупку…'));
    let okPay;
    try { okPay = await redeem(user, pend); } catch { return show(T.err('Нет связи — покупка не активировалась. Проверьте интернет и нажмите «Повторить»: ссылка не пропадёт.')); }
    PAY.drop();
    if (okPay) { if (BC) BC.postMessage('paid'); return enter(user); }
    ACC.payErr = 'Эта ссылка уже использована на другом аккаунте. Если покупали вы — войдите тем аккаунтом, на котором активировали, или напишите нам.';
  }
  // почта, имя и время захода — чтобы владелец видел покупателя в admin.html
  F.db('users/' + user.uid, { method: 'PATCH', body: { email: user.email, name: (user.displayName || '').slice(0, 100), seen: F.TS, ...(m.first ? {} : { first: F.TS }) }, user }).catch(() => {});
  if (meta.status === 'rejected') {
    if (meta.reason.code !== 'denied') return show(T.err('Нет связи с сервером. Проверьте интернет.'));
    show(m.blocked ? T.blocked(user) : subEnd(m) ? T.subOver(user, m) : m.trial && m.trial.start ? T.trialOver(user, m) : T.nopay(user));
    if (ACC.payErr) { setErr(ACC.payErr, '#g-code-err'); ACC.payErr = ''; }
    return;
  }
  if (!meta.value) return show(T.nobuild());
  ACC.user = user; ACC.me = m; ACC.plan = planOf(m);
  const sid = sidOf(user.uid);
  try { await claim(user, sid); } catch { /* не страшно: проверим при следующем опросе */ }
  load(user, meta.value, sid);
}

const BAD_CODE = 'Код не подошёл: проверьте, нет ли опечатки. Каждый код работает только для одного аккаунта.';
/** Код активации → доступ. true — готово, false — код не подошёл; нет связи — исключение. */
async function redeem(user, k) {
  // 1) закрепить код за этим аккаунтом (если он уже наш — база откажет, это нормально), 2) открыть доступ
  try { await F.db(`codes/${k}/used`, { method: 'PUT', body: { by: user.uid, at: F.TS, email: user.email }, user }); }
  catch (e) { if (e.code !== 'denied') throw e; }
  // код подписки (days): срок — от конца текущей подписки или от сегодня; время берём у сервера, база проверяет сама
  let days = null; try { days = await F.db(`codes/${k}/days`, { user }); } catch (e) { if (e.code !== 'denied') throw e; }
  if (typeof days === 'number' && days > 0) {
    await F.db(`users/${user.uid}/seen`, { method: 'PUT', body: F.TS, user });
    const me = (await F.db('users/' + user.uid, { user })) || {}, now = me.seen || Date.now(), base = typeof me.until === 'number' && me.until > now ? me.until : now - 60000;
    try { await F.db('users/' + user.uid, { method: 'PATCH', body: { until: base + days * 86400000, untilCode: k, ['subs/' + k]: true }, user }); return true; }
    catch (e) { if (e.code === 'denied') return false; throw e; }
  }
  try { await F.db('users/' + user.uid, { method: 'PATCH', body: { code: k, paid: true }, user }); return true; }
  catch (e) { if (e.code === 'denied') return false; throw e; }
}
/** После активации: план заново по базе (навсегда или подписка до даты), значок и кнопки Монтажки. */
async function afterRedeem() { await refreshMe(); ACC.plan = planOf(ACC.me); trialChip(); fire(); if (BC) BC.postMessage('paid'); return ACC.plan; }
const doneTxt = () => ACC.plan === 'sub' ? `Готово — подписка до ${dateTxt(subEnd(ACC.me))}.` : 'Готово — Монтажка ваша, скачивать можно без ограничений.';
async function activate(user, form) {
  const inp = form.code, btn = form.querySelector('button'), k = F.normCode(inp.value);
  if (!F.okCode(k)) { setErr('В коде 16 букв и цифр, например ABCD-EFGH-JKLM-NPQR.', '#g-code-err'); inp.focus(); return; }
  btn.disabled = true; btn.textContent = 'Проверяю…'; setErr('', '#g-code-err');
  const back = t => { btn.disabled = false; btn.textContent = 'Активировать'; setErr(t, '#g-code-err'); inp.focus(); };
  try { if (!(await redeem(user, k))) return back(BAD_CODE); enter(user); }
  catch (e) { back(F.authError(e)); }
}
/** Начать пробный период. По ссылке-приглашению — засчитать приглашение другу. */
async function startTrial(user, btn) {
  btn.disabled = true; btn.textContent = 'Открываю…'; setErr('');
  const ref = REF && REF !== user.uid ? REF : '';
  try {
    try { await F.db(`users/${user.uid}/trial`, { method: 'PUT', body: ref ? { start: F.TS, ref } : { start: F.TS }, user }); }
    catch (e) { if (e.code === 'denied' && ref) await F.db(`users/${user.uid}/trial`, { method: 'PUT', body: { start: F.TS }, user }); else throw e; }   // кривая ссылка не мешает начать
    if (ref) await F.db('users/' + ref, { method: 'PATCH', body: { [`invited/${user.uid}`]: true, bonus: { '.sv': { increment: 1 } } }, user }).catch(() => {});
    try { localStorage.removeItem('montage-access:ref'); } catch {}
    enter(user);
  } catch (e) { btn.disabled = false; btn.textContent = 'Попробовать бесплатно — 5 дней'; setErr(e.code === 'denied' ? 'Пробный период у этого аккаунта уже был.' : F.authError(e)); }
}

async function load(user, meta, sid) {
  show(T.load());
  const bar = view.querySelector('.g-bar'), set = p => { bar.style.setProperty('--p', p); bar.setAttribute('aria-valuenow', Math.round(p * 100)); };
  let html = null;
  const c = await cache('get');
  if (c && c.v === meta.v) { html = c.html; set(1); }
  else {
    let parts;
    try { parts = await F.db('app/parts', { user, onProgress: got => set(Math.min(0.98, got / (meta.bytes || 1e6))) }); }
    catch (e) { return show(e.code === 'denied' ? T.nopay(user) : T.err('Загрузка прервалась. Проверьте интернет.')); }
    html = (Array.isArray(parts) ? parts : Object.keys(parts || {}).sort((a, b) => a - b).map(k => parts[k])).join('');
    if (await F.sha256(html) !== meta.v) return show(T.err('Монтажка пришла повреждённой. Попробуйте ещё раз.'));
    set(1);
    cache('put', { v: meta.v, html });
  }
  if (!reduced()) { card.classList.add('g-out'); await new Promise(r => setTimeout(r, 180)); }
  window.montageAccess = { get plan() { return ACC.plan; }, locked: () => ACC.plan === 'trial' && exportsLeft(ACC.me) <= 0, exportBegin, open: () => trialPanel() };
  inject(html, user);
  trialChip();
  if (ACC.payErr) { const t = ACC.payErr; ACC.payErr = ''; setTimeout(() => confirmPop('Ссылка из магазина не сработала', E(t), 'Понятно'), 400); }
  watch(user, sid);
}

// ---------------------------------------------------------------- запуск Монтажки на этой же странице
function inject(html, user) {
  const d = new DOMParser().parseFromString(html, 'text/html'), H = document.head;
  // скрипты, пришедшие через DOMParser, сами не запускаются — пересоздаём их
  const fresh = old => { const s = document.createElement('script'); for (const a of old.attributes) s.setAttribute(a.name, a.value); s.textContent = old.textContent; return s; };
  document.title = d.title || 'Монтажка';
  const lang = d.documentElement.getAttribute('lang'); if (lang) document.documentElement.lang = lang;
  $('#g-css').remove();
  for (const n of [...d.head.children]) {
    if (n.matches('title, meta[charset], meta[name=viewport]')) continue;
    if (n.matches('meta[name]')) H.querySelector(`meta[name="${n.getAttribute('name')}"]`)?.remove();
    if (n.matches('link[href]') && [...H.querySelectorAll('link[href]')].some(l => l.getAttribute('href') === n.getAttribute('href'))) continue;
    H.append(n.tagName === 'SCRIPT' ? fresh(n) : document.importNode(n, true));
  }
  const lic = document.createElement('meta'); lic.name = 'montage-license'; lic.content = `${user.email} · ${user.uid}`; H.append(lic);
  for (const a of [...document.body.attributes]) document.body.removeAttribute(a.name);
  for (const a of d.body.attributes) document.body.setAttribute(a.name, a.value);
  document.body.replaceChildren(...[...d.body.childNodes].map(n => document.importNode(n, true)));
  for (const old of [...document.body.querySelectorAll('script')]) old.replaceWith(fresh(old));
  const foot = document.querySelector('#main > footer') || document.querySelector('footer');
  if (foot) {
    const s = document.createElement('span'); s.className = 'g-acct';
    s.innerHTML = `Вход: ${E(user.email)} · <button type="button" class="g-acct-out">Выйти</button>`;
    s.querySelector('button').onclick = () => { if (confirm('Выйти из аккаунта? Несохранённая работа в этой вкладке пропадёт.')) leave(); };
    foot.append(s);
  }
}

async function leave() {
  try { await F.signOut(); } catch {}
  await cache('drop');
  location.reload();
}

// ---------------------------------------------------------------- пробный период внутри Монтажки: значок, окно, скачивания
const fire = () => dispatchEvent(new Event('montage-access'));          // Монтажка перерисует кнопки скачивания
async function refreshMe() { try { ACC.me = (await F.db('users/' + ACC.user.uid, { user: ACC.user })) || {}; } catch {} return ACC.me; }
function trialChip() {
  let b = document.querySelector('.g-trial');
  if (ACC.plan !== 'trial' && ACC.plan !== 'sub') { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('button'); b.type = 'button'; b.className = 'g-trial'; b.addEventListener('click', () => ACC.plan === 'sub' ? subPanel() : trialPanel());
    const mon = document.querySelector('.deck .monitor'); if (mon) mon.prepend(b); else { b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:60'; document.body.append(b); }
  }
  const sub = ACC.plan === 'sub', txt = sub ? 'до ' + dateTxt(subEnd(ACC.me)) : daysTxt(trialLeft(ACC.me)), html = `<i aria-hidden="true"></i><span><span class="g-trial-l">${sub ? 'Подписка' : 'Проба'} · </span>${E(txt)}</span>`;
  if (b.innerHTML !== html) b.innerHTML = html;
  b.classList.toggle('g-sub', sub);
  b.setAttribute('aria-label', sub ? `Подписка ${txt}. Продлить` : `Пробный период: ${txt}. Приглашения, покупка, код`);
}
/** Окно поверх Монтажки: затемнение, карточка, Esc и щелчок мимо закрывают, фокус возвращается. */
function pop(html, { closable = true } = {}) {
  const prev = document.activeElement, el = document.createElement('div');
  el.className = 'g-lock g-pop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'g-pop-h');
  el.innerHTML = `<div class="g-lock-card">${closable ? '<button type="button" class="g-x" data-a="close" aria-label="Закрыть">×</button>' : ''}${html}</div>`;
  const off = [...document.body.children].filter(c => !c.inert); off.forEach(c => { c.inert = true; });
  document.body.append(el);
  const close = () => { if (!el.isConnected) return; off.forEach(c => { c.inert = false; }); el.remove(); document.removeEventListener('keydown', key, true); if (prev && prev.isConnected) prev.focus({ preventScroll: true }); el.onclose && el.onclose(); };
  const key = e => { if (e.key === 'Escape' && closable) { e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key, true);
  el.addEventListener('click', e => { if (closable && (e.target === el || e.target.closest('[data-a="close"]'))) close(); });
  (el.querySelector('.g-lock-card button:not(.g-x), .g-lock-card input, .g-lock-card a') || el.querySelector('button')).focus({ preventScroll: true });
  el.close = close; return el;
}
function confirmPop(title, text, ok) {
  return new Promise(res => {
    const el = pop(`<h2 id="g-pop-h">${E(title)}</h2><p>${text}</p><div class="g-lock-row"><button type="button" class="g-lock-go" data-a="ok">${E(ok)}</button><button type="button" class="g-lock-alt" data-a="close">Отмена</button></div>`);
    let done = false; el.onclose = () => { if (!done) res(false); };
    el.querySelector('[data-a="ok"]').addEventListener('click', () => { done = true; el.close(); res(true); });
  });
}
/** Окно пробного периода: сколько осталось, ссылка-приглашение, покупка, код. why — «скачать MP3» и т. п. */
function trialPanel(why) {
  const m = ACC.me, left = exportsLeft(m), inv = Math.min(MAX_INVITES, m.bonus || 0), url = inviteUrl(ACC.user.uid), tl = trialLeft(m);
  const el = pop(`<h2 id="g-pop-h">${why ? `Скачать ${E(why)} — после покупки` : 'Пробный период'}</h2>
    <p>${tl > 0 ? `Осталось <b>${E(daysTxt(tl))}</b> — до ${E(dateTxt(m.trial.start + TRIAL_MS))}. ` : ''}Всё работает и слушается прямо здесь. Скачивать файлы можно после покупки — или за приглашения: каждый друг, начавший пробный период по вашей ссылке, даёт ${PER_INVITE} скачивания${inv >= MAX_INVITES ? '' : ` (засчитывается до ${MAX_INVITES} друзей)`}.</p>
    <p class="g-stat"><span>Приглашено друзей: <b>${inv}</b></span><span>Скачиваний осталось: <b>${left}</b></span></p>
    <label class="g-lbl" for="g-inv">Ваша ссылка-приглашение</label>
    <div class="g-in"><input id="g-inv" readonly value="${E(url)}"><button type="button" data-a="copy">Скопировать</button>${navigator.share ? '<button type="button" data-a="share">Поделиться</button>' : ''}</div>
    <div class="g-sep"></div>
    <form data-a="code" novalidate><label class="g-lbl" for="g-pcode">Есть код активации?</label><div class="g-in"><input id="g-pcode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX"><button type="submit">Активировать</button></div><p class="g-msg" role="alert"></p></form>
    ${CFG.buyUrl ? payNote : ''}
    <div class="g-lock-row">${CFG.buyUrl ? `<a class="g-lock-go g-buy" href="${E(CFG.buyUrl)}" target="_blank" rel="noopener">Купить Монтажку</a>` : ''}<button type="button" class="g-lock-alt" data-a="close">Закрыть</button></div>`);
  const msg = el.querySelector('.g-msg'), inp = el.querySelector('#g-pcode');
  el.querySelector('#g-inv').addEventListener('focus', e => e.target.select());
  el.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'copy') { try { await navigator.clipboard.writeText(url); } catch { const i = el.querySelector('#g-inv'); i.select(); document.execCommand('copy'); } b.textContent = 'Скопировано'; setTimeout(() => { b.textContent = 'Скопировать'; }, 1500); }
    if (b.dataset.a === 'share') { try { await navigator.share({ title: 'Монтажка', text: 'Собираю радиоспектакль в Монтажке — попробуй 5 дней бесплатно', url }); } catch {} }
  });
  inp.addEventListener('input', () => { const k = F.normCode(inp.value).slice(0, 16), f = k ? F.fmtCode(k) : ''; if (f !== inp.value) inp.value = f; msg.textContent = ''; msg.className = 'g-msg'; });
  el.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault(); const k = F.normCode(inp.value), btn = e.target.querySelector('button');
    if (!F.okCode(k)) { msg.textContent = 'В коде 16 букв и цифр, например ABCD-EFGH-JKLM-NPQR.'; inp.focus(); return; }
    btn.disabled = true; btn.textContent = 'Проверяю…';
    try {
      if (!(await redeem(ACC.user, k))) { msg.textContent = BAD_CODE; btn.disabled = false; btn.textContent = 'Активировать'; inp.focus(); return; }
      await afterRedeem();
      msg.className = 'g-msg ok'; msg.textContent = doneTxt(); btn.textContent = 'Готово';
      setTimeout(() => el.close(), 1400);
    } catch (err) { msg.textContent = F.authError(err); btn.disabled = false; btn.textContent = 'Активировать'; }
  });
  return el;
}
/** Окно подписки: до какого числа, продлить (купить месяц), ввести код. */
function subPanel() {
  const m = ACC.me, end = subEnd(m), left = subLeft(m);
  const el = pop(`<h2 id="g-pop-h">Подписка</h2>
    <p>Действует до <b>${E(dateTxt(end))}</b> — ${E(daysTxt(left))}. Продление добавляет месяц к концу подписки, ничего не пропадает.</p>
    <form data-a="code" novalidate><label class="g-lbl" for="g-scode">Код продления</label><div class="g-in"><input id="g-scode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX"><button type="submit">Активировать</button></div><p class="g-msg" role="status"></p></form>
    ${CFG.buyUrl ? payNote : ''}
    <div class="g-lock-row">${CFG.buyUrl ? `<a class="g-lock-go g-buy" href="${E(CFG.buyUrl)}" target="_blank" rel="noopener">Продлить на месяц</a>` : ''}<button type="button" class="g-lock-alt" data-a="close">Закрыть</button></div>`);
  const msg = el.querySelector('.g-msg'), inp = el.querySelector('#g-scode');
  inp.addEventListener('input', () => { const k = F.normCode(inp.value).slice(0, 16), f = k ? F.fmtCode(k) : ''; if (f !== inp.value) inp.value = f; msg.textContent = ''; msg.className = 'g-msg'; });
  el.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault(); const k = F.normCode(inp.value), btn = e.target.querySelector('button');
    if (!F.okCode(k)) { msg.textContent = 'В коде 16 букв и цифр, например ABCD-EFGH-JKLM-NPQR.'; inp.focus(); return; }
    btn.disabled = true; btn.textContent = 'Проверяю…';
    try {
      if (!(await redeem(ACC.user, k))) { msg.textContent = BAD_CODE; btn.disabled = false; btn.textContent = 'Активировать'; inp.focus(); return; }
      await afterRedeem(); msg.className = 'g-msg ok'; msg.textContent = doneTxt(); btn.textContent = 'Готово'; setTimeout(() => el.close(), 1600);
    } catch (err) { msg.textContent = F.authError(err); btn.disabled = false; btn.textContent = 'Активировать'; }
  });
  return el;
}
/** Скачивание файла из Монтажки. Купившим — сразу; на пробе — за приглашения, со счётом в базе. */
async function exportBegin(what) {
  if (ACC.plan !== 'trial') return { commit: async () => true };
  await refreshMe();
  if (ACC.plan === 'trial' && planOf(ACC.me) !== 'trial') { ACC.plan = planOf(ACC.me); trialChip(); fire(); return { commit: async () => true }; }
  if (exportsLeft(ACC.me) <= 0) { trialPanel(what); return null; }
  const n = exportsLeft(ACC.me);
  if (!(await confirmPop(`Скачать ${what}?`, `На пробном периоде скачивания — за приглашения. Осталось: <b>${n}</b>, после этого — ${n - 1}.`, 'Скачать'))) return null;
  return { commit: async () => {
    for (let i = 0; i < 2; i++) {
      const next = (ACC.me.exports || 0) + 1;
      try { await F.db(`users/${ACC.user.uid}/exports`, { method: 'PUT', body: next, user: ACC.user }); ACC.me.exports = next; fire(); return true; }
      catch (e) {
        if (e.code !== 'denied') { confirmPop('Нет связи с сервером', 'Скачивание не засчитано и не началось — проверьте интернет и попробуйте ещё раз.', 'Понятно'); return false; }
        await refreshMe(); if (exportsLeft(ACC.me) <= 0) { trialPanel(what); return false; }     // посчитали в другой вкладке — сверяемся
      }
    }
    return false;
  } };
}

// ---------------------------------------------------------------- пока Монтажка открыта: доступ не отключён? не вошли ли с другого устройства?
function watch(user, sid) {
  let busy = false, last = Date.now(), lockEl = null;
  async function check(force) {
    if (busy || lockEl || document.hidden || (!force && Date.now() - last < 15000)) return;
    busy = true; last = Date.now();
    try {
      const [me, ok] = await Promise.all([
        F.db('users/' + user.uid, { user }),
        F.db('app/meta/v', { user }).then(() => true, e => { if (e.code === 'denied') return false; throw e; }),
      ]);
      const was = ACC.plan + '|' + exportsLeft(ACC.me); ACC.me = me || {};
      if (ACC.plan !== 'admin' || planOf(ACC.me) !== 'admin') ACC.plan = planOf(ACC.me);   // купил, продлил, владелец выдал — план по базе
      trialChip(); if (was !== ACC.plan + '|' + exportsLeft(ACC.me)) fire();
      const s = ACC.me.session && ACC.me.session.id;
      if (!ok) lock(ACC.me.blocked ? 'revoked' : subEnd(ACC.me) && subLeft(ACC.me) <= 0 && !ACC.me.paid ? 'sub' : trialLeft(ACC.me) <= 0 && ACC.me.trial ? 'trial' : 'revoked');
      else if (s && s !== sid) lock('other');
      else if (!s) await claim(user, sid);           // владелец сбросил устройство — занимаем снова
    } catch { /* нет связи — работать не мешаем */ }
    busy = false;
  }
  function lock(kind) {
    const prev = document.activeElement;
    lockEl = document.createElement('div');
    lockEl.className = 'g-lock';
    lockEl.setAttribute('role', 'alertdialog'); lockEl.setAttribute('aria-modal', 'true'); lockEl.setAttribute('aria-labelledby', 'g-lock-h');
    lockEl.innerHTML = kind === 'trial' || kind === 'sub'
      ? `<div class="g-lock-card"><h2 id="g-lock-h">${kind === 'sub' ? 'Подписка закончилась' : 'Пробный период закончился'}</h2><p>${kind === 'sub' ? 'Чтобы продолжить — продлите подписку на месяц и введите код (или откройте ссылку из магазина).' : 'Чтобы продолжить — купите Монтажку и введите код.'} Всё, что вы сделали, на месте.</p><form data-a="code" novalidate><label class="g-lbl" for="g-lcode">Код активации</label><div class="g-in"><input id="g-lcode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX"><button type="submit">Активировать</button></div><p class="g-msg" role="alert"></p></form>${CFG.buyUrl ? payNote : ''}<div class="g-lock-row">${CFG.buyUrl ? `<a class="g-lock-go g-buy" href="${E(CFG.buyUrl)}" target="_blank" rel="noopener">${kind === 'sub' ? 'Продлить на месяц' : 'Купить Монтажку'}</a>` : ''}<button type="button" class="g-lock-alt" data-a="out">Выйти</button></div></div>`
      : kind === 'other'
      ? `<div class="g-lock-card"><h2 id="g-lock-h">Монтажка открыта на другом устройстве</h2><p>Работать можно на одном устройстве за раз. Всё, что вы сделали здесь, на месте: продолжите — и на том устройстве Монтажка встанет на паузу.</p><div class="g-lock-row"><button type="button" class="g-lock-go" data-a="here">Продолжить здесь</button><button type="button" class="g-lock-alt" data-a="out">Выйти</button></div></div>`
      : `<div class="g-lock-card"><h2 id="g-lock-h">Доступ к Монтажке отключён</h2><p>${contact ? 'Если это ошибка — напишите нам. ' + contact : 'Если это ошибка — напишите владельцу Монтажки.'}</p><div class="g-lock-row"><button type="button" class="g-lock-alt" data-a="out">Выйти</button></div></div>`;
    const off = [...document.body.children].filter(c => !c.inert);
    off.forEach(c => { c.inert = true; });
    document.body.append(lockEl);
    document.querySelectorAll('audio, video').forEach(m => m.pause());
    const unlock = () => { off.forEach(c => { c.inert = false; }); lockEl.remove(); lockEl = null; last = Date.now(); if (prev && prev.isConnected) prev.focus({ preventScroll: true }); };
    const form = lockEl.querySelector('form');
    if (form) {
      const inp = form.code, msg = form.querySelector('.g-msg');
      inp.addEventListener('input', () => { const k = F.normCode(inp.value).slice(0, 16), f = k ? F.fmtCode(k) : ''; if (f !== inp.value) inp.value = f; msg.textContent = ''; });
      form.addEventListener('submit', async e => {
        e.preventDefault(); const k = F.normCode(inp.value), btn = form.querySelector('button');
        if (!F.okCode(k)) { msg.textContent = 'В коде 16 букв и цифр, например ABCD-EFGH-JKLM-NPQR.'; return; }
        btn.disabled = true;
        try { if (!(await redeem(user, k))) { msg.textContent = BAD_CODE; btn.disabled = false; return; } }
        catch (err) { msg.textContent = F.authError(err); btn.disabled = false; return; }
        await afterRedeem(); unlock();
      });
    }
    (lockEl.querySelector('input') || lockEl.querySelector('button')).focus();
    lockEl.onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a === 'out') return leave();
      if (b.dataset.a !== 'here') return;
      b.disabled = true;
      try { await claim(user, sid); } catch { b.disabled = false; return; }
      unlock();
    };
  }
  setInterval(() => check(), 60000);
  if (BC) BC.onmessage = () => { last = 0; check(true); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  addEventListener('focus', () => check());
  if (F.EMU) window.__montageAccessCheck = () => check(true);
}

// ---------------------------------------------------------------- кнопки
view.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'retry') return start();
  if (a === 'trial') { const u = await F.currentUser(); if (u) startTrial(u, b); else show(T.out()); return; }
  if (a === 'switch') { try { await F.signOut(); } catch {} return show(T.out()); }
  if (a === 'in') {
    b.disabled = true; setErr('');
    try { enter(await F.signIn()); }
    catch (err) { b.disabled = false; setErr(F.authError(err)); }
  }
});
view.addEventListener('submit', async e => {
  e.preventDefault();
  const user = await F.currentUser();
  if (user) activate(user, e.target); else show(T.out());
});
view.addEventListener('input', e => {
  if (e.target.id !== 'g-code') return;
  const k = F.normCode(e.target.value).slice(0, 16), f = k ? F.fmtCode(k) : '';
  if (f !== e.target.value) e.target.value = f;
  setErr('');
});
if (F.EMU) window.__montageAccess = { signIn: async email => enter(await F.emuSignIn(email)) };
start();
</script>
